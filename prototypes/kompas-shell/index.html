<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип оболочки ASA-CAD</title>
<style>
/* Тёмная тема — основная (снята с КОМПАС-3D пользователя), светлая — переопределение токенов */
:root{
  color-scheme: dark;
  --frame:#000000; --menubar:#333333; --menubar-hover:#4c4c4c; --tabs:#4c4c4c; --tab-active:#000000; --tab-active-text:#f2f2f2;
  --instr:#484848; --instr-label:#333333; --instr-sep:#000000; --btn-hover:#5f5f5f; --btn-press:#000000; --toolset-active:#000000;
  --text:#f0f0f0; --text-muted:#bdbdbd; --text-dim:#8e8e8e; --icon:#f0f0f0;
  --rail:#333333; --rail-active:#000000; --panel:#484848; --panel-head:#333333; --field:#666666; --field-border:#2b2b2b; --field-text:#f6f6f6;
  --tree-gutter:#333333; --tree-line:#3b3b3b; --tree-sel:#666666;
  --row-hl:#3a9eb4; --select-line:#33cce5; --link:#57b8ff; --msg:#3a3a3a; --section:#333333;
  --toggle-knob:#dedede; --toggle-track:#666666;
  --vp-top:#4b4b4c; --vp-bottom:#3a3a3a; --qa:#484848; --qa-active:#b2b2b2; --qa-active-icon:#111111;
  --ok:#3fcf5c; --cancel:#ff4b4b; --sketch-accent:#5ed08b;
  --plane-xy:#3d8fdc; --plane-zx:#8fd13f; --plane-zy:#e58c8c; --sketch-geom:#d650d6; --body:#a3adb8; --body-edge:#1c1c1c;
  --phantom:#caa58c; --phantom-edge:#e6e6e6; --profile:#ffd400; --hover3d:#8ad9ff; --sel3d:#33e5ff; --manip:#2f8cff;
  --st-impl:#4cc36a; --st-plan:#e3a21a; --st-def:#9a9a9a; --st-none:#ef6464;
  --toast-bg:#1b1b1b; --toast-text:#f2f2f2; --menu-pop:#3d3d3d; --shadow:rgba(0,0,0,.45); --scroll:#6a6a6a;
  --menu-bg:#666666; --menu-border:#d2d2d2; --menu-sep:#e6e6e6; --menu-hover:#7d7d7d; --menu-text:#ffffff; --menu-dim:#a3a3a3; --menu-icon-on:#000000;
  --tip-bg:#fdf6c8; --tip-text:#1e1e1e; --tip-border:#8a8156; --dlg-bg:#484848; --dlg-head:#333333; --btn-bg:#5e5e5e; --btn-border:#2a2a2a;
  --sf-front:#cdcdcd; --sf-top:#f4f4f4; --sf-side:#9d9d9d; --sf-dark:#3a3a3a; --sf-line:#1c1c1c; --sf-acc:#5cb8ff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --frame:#a8a8a8; --menubar:#f0f0f0; --menubar-hover:#dadada; --tabs:#d6d6d6; --tab-active:#ffffff; --tab-active-text:#1c1c1c;
    --instr:#f5f5f5; --instr-label:#e3e3e3; --instr-sep:#c6c6c6; --btn-hover:#dce9f5; --btn-press:#c3daf0; --toolset-active:#cde1f3;
    --text:#1e1e1e; --text-muted:#505050; --text-dim:#8a8a8a; --icon:#2b2b2b;
    --rail:#e6e6e6; --rail-active:#ffffff; --panel:#f5f5f5; --panel-head:#e3e3e3; --field:#ffffff; --field-border:#b5b5b5; --field-text:#1c1c1c;
    --tree-gutter:#ebebeb; --tree-line:#e2e2e2; --tree-sel:#cde1f3;
    --row-hl:#3a9eb4; --select-line:#15a6c7; --link:#0b6fd1; --msg:#ebebeb; --section:#e3e3e3;
    --toggle-knob:#ffffff; --toggle-track:#b5b5b5;
    --vp-top:#fbfbfc; --vp-bottom:#c8cdd5; --qa:#f0f0f0; --qa-active:#9fc5e8; --qa-active-icon:#0f2a44;
    --ok:#1f9e3c; --cancel:#e02e2e; --sketch-accent:#2fae62;
    --plane-xy:#2a77c9; --plane-zx:#5fa61f; --plane-zy:#d05a5a; --sketch-geom:#b01aa6; --body:#b7c0ca; --body-edge:#2a2a2a;
    --phantom:#b3825f; --phantom-edge:#555555; --profile:#d4a100; --hover3d:#3a9ee6; --sel3d:#00a3d6; --manip:#1f6fe0;
    --st-impl:#23a046; --st-plan:#c98a00; --st-def:#8d8d8d; --st-none:#d93b3b;
    --toast-bg:#2b2b2b; --toast-text:#f5f5f5; --menu-pop:#ffffff; --shadow:rgba(0,0,0,.18); --scroll:#b9b9b9;
    --menu-bg:#ffffff; --menu-border:#a6a6a6; --menu-sep:#d4d4d4; --menu-hover:#cde1f3; --menu-text:#1c1c1c; --menu-dim:#a2a2a2; --menu-icon-on:#cde1f3;
    --tip-bg:#ffffe1; --tip-text:#1e1e1e; --tip-border:#9a9a9a; --dlg-bg:#f5f5f5; --dlg-head:#e3e3e3; --btn-bg:#ffffff; --btn-border:#b5b5b5;
    --sf-front:#d3d9e1; --sf-top:#ffffff; --sf-side:#98a3b1; --sf-dark:#55606c; --sf-line:#2b3137; --sf-acc:#1f6fd1;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --frame:#a8a8a8; --menubar:#f0f0f0; --menubar-hover:#dadada; --tabs:#d6d6d6; --tab-active:#ffffff; --tab-active-text:#1c1c1c;
  --instr:#f5f5f5; --instr-label:#e3e3e3; --instr-sep:#c6c6c6; --btn-hover:#dce9f5; --btn-press:#c3daf0; --toolset-active:#cde1f3;
  --text:#1e1e1e; --text-muted:#505050; --text-dim:#8a8a8a; --icon:#2b2b2b;
  --rail:#e6e6e6; --rail-active:#ffffff; --panel:#f5f5f5; --panel-head:#e3e3e3; --field:#ffffff; --field-border:#b5b5b5; --field-text:#1c1c1c;
  --tree-gutter:#ebebeb; --tree-line:#e2e2e2; --tree-sel:#cde1f3;
  --row-hl:#3a9eb4; --select-line:#15a6c7; --link:#0b6fd1; --msg:#ebebeb; --section:#e3e3e3;
  --toggle-knob:#ffffff; --toggle-track:#b5b5b5;
  --vp-top:#fbfbfc; --vp-bottom:#c8cdd5; --qa:#f0f0f0; --qa-active:#9fc5e8; --qa-active-icon:#0f2a44;
  --ok:#1f9e3c; --cancel:#e02e2e; --sketch-accent:#2fae62;
  --plane-xy:#2a77c9; --plane-zx:#5fa61f; --plane-zy:#d05a5a; --sketch-geom:#b01aa6; --body:#b7c0ca; --body-edge:#2a2a2a;
  --phantom:#b3825f; --phantom-edge:#555555; --profile:#d4a100; --hover3d:#3a9ee6; --sel3d:#00a3d6; --manip:#1f6fe0;
  --st-impl:#23a046; --st-plan:#c98a00; --st-def:#8d8d8d; --st-none:#d93b3b;
  --toast-bg:#2b2b2b; --toast-text:#f5f5f5; --menu-pop:#ffffff; --shadow:rgba(0,0,0,.18); --scroll:#b9b9b9;
    --menu-bg:#ffffff; --menu-border:#a6a6a6; --menu-sep:#d4d4d4; --menu-hover:#cde1f3; --menu-text:#1c1c1c; --menu-dim:#a2a2a2; --menu-icon-on:#cde1f3;
    --tip-bg:#ffffe1; --tip-text:#1e1e1e; --tip-border:#9a9a9a; --dlg-bg:#f5f5f5; --dlg-head:#e3e3e3; --btn-bg:#ffffff; --btn-border:#b5b5b5;
    --sf-front:#d3d9e1; --sf-top:#ffffff; --sf-side:#98a3b1; --sf-dark:#55606c; --sf-line:#2b3137; --sf-acc:#1f6fd1;
}
:root[data-theme="dark"]{ color-scheme: dark; }

/* Эталонная сетка KOMPAS v25 @1920×1080, 100 %: меню 28, вкладки 27, инструментальная область 93, рейка 26, панель 310 */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:12px/1.25 "Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--select-line);outline-offset:-2px}
*{box-sizing:border-box}
.ic{display:block;flex:none;color:var(--icon)}
.ic-xy{color:var(--plane-xy)} .ic-zx{color:var(--plane-zx)} .ic-zy{color:var(--plane-zy)}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px} ::-webkit-scrollbar-track{background:transparent}

.app{height:100%;display:grid;grid-template-rows:28px 27px 93px minmax(0,1fr);padding:0 3px 3px;background:var(--frame);min-width:0;position:relative}

/* ── строка меню ── */
.main-menu-bar{display:flex;align-items:center;gap:6px;background:var(--menubar);border-top:5px solid var(--frame);min-width:0;padding-right:6px}
.app-mark{width:20px;height:19px;margin-left:3px;display:grid;place-items:center;flex:none}
.app-mark svg{width:19px;height:19px}
.main-menu-items{display:flex;align-items:stretch;height:22px;min-width:0;overflow-x:auto;scrollbar-width:none;position:relative}
.main-menu-items::-webkit-scrollbar{display:none}
.menu-item{padding:0 6px;height:22px;white-space:nowrap;font-size:12px;border-radius:0}
.menu-item:hover,.menu-item[aria-expanded="true"]{background:var(--menubar-hover)}
.title-tools{display:flex;margin-left:auto;gap:0}
.title-tools button{width:26px;height:22px;display:grid;place-items:center}
.title-tools button:hover{background:var(--menubar-hover)}
.command-search{position:relative;width:166px;height:22px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--field);border:1px solid var(--field-border)}
.command-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:12px;color:var(--field-text)}
.command-search input::placeholder{color:var(--text-dim)}
.search-results{position:absolute;right:-1px;top:23px;width:300px;max-width:calc(100vw - 16px);background:var(--menu-pop);border:1px solid var(--frame);box-shadow:0 8px 20px var(--shadow);z-index:60;padding:3px}
.search-results button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;text-align:left}
.search-results button:hover,.search-results button:focus-visible{background:var(--btn-hover)}
.search-results small{margin-left:auto;color:var(--text-dim);white-space:nowrap}
.search-empty{padding:8px;color:var(--text-dim)}
/* выпадающие меню в стиле КОМПАСа: серый фон, белые разделители, колонка значков, ▶ для подменю */
.pop{position:fixed;z-index:80;min-width:180px;max-width:calc(100vw - 16px);background:var(--menu-bg);color:var(--menu-text);border:1px solid var(--menu-border);box-shadow:2px 4px 12px var(--shadow);padding:1px 0;overflow-y:auto;overscroll-behavior:contain}
.pop .mi{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto 18px;align-items:center;width:100%;height:25px;padding:0 4px 0 0;text-align:left;white-space:nowrap;color:var(--menu-text);font-size:12.5px;column-gap:2px}
.pop .mi .ic{color:var(--menu-text);justify-self:center}
.pop .mi .mi-k{padding-left:28px;font-size:12px}
.pop .mi .mi-ar{font-size:9px;justify-self:end;padding-right:4px}
.pop .mi .mi-ck{justify-self:center;font-size:13px}
.pop .mi .mi-on{width:24px;height:22px;display:grid;place-items:center;background:var(--menu-icon-on);justify-self:center}
.pop .mi .mi-on .ic{color:#fff}
:root[data-theme="light"] .pop .mi .mi-on .ic{color:var(--menu-text)}
.pop .mi:hover:not([aria-disabled="true"]),.pop .mi:focus-visible,.pop .mi.open{background:var(--menu-hover);outline:0}
.pop .mi[aria-disabled="true"]{color:var(--menu-dim);cursor:default}
.pop .mi[aria-disabled="true"] .ic{color:var(--menu-dim)}
.pop hr{border:0;border-top:1px solid var(--menu-sep);margin:2px 0 2px 30px}
.pop .pop-scroll{display:block;text-align:center;font-size:9px;color:var(--menu-dim);height:14px}
.pop.views{min-width:0;padding:6px}
.view-grid{display:grid;grid-template-columns:repeat(4,30px);grid-template-rows:repeat(3,28px);gap:2px;justify-content:center;margin:2px 0 4px}
.view-grid button{display:grid;place-items:center;border-radius:1px}
.view-grid button:hover{background:var(--menu-hover)}
.pop.views .mi{grid-template-columns:30px minmax(0,1fr)}
.pop.views .mi.cur{background:var(--menu-icon-on)}
:root:not([data-theme="light"]) .pop.views .mi.cur{color:#fff}
/* всплывающая подсказка как в КОМПАСе */
.tip{position:fixed;z-index:95;background:var(--tip-bg);color:var(--tip-text);border:1px solid var(--tip-border);padding:3px 7px 4px;font-size:12px;line-height:1.35;pointer-events:none;max-width:320px;box-shadow:1px 2px 6px rgba(0,0,0,.25)}
.tip small{display:block;color:#5a5a5a;font-size:11.5px}
/* раскрытая панель инструментов */
.panel-drop{position:fixed;z-index:75;background:var(--instr);border:1px solid var(--frame);box-shadow:0 8px 18px var(--shadow);display:flex;flex-direction:column}
.panel-drop .cmd-panel-body{display:flex;gap:1px;padding:0 1px}
.panel-drop .cmd-panel-label{width:auto;min-width:0;height:18px}
.panel-drop .cmd-panel-label .caret{transform:rotate(180deg)}
.cmd-panel-label .caret-btn{display:grid;place-items:center;width:14px;height:16px;flex:none}
.cmd-panel-label .caret-btn:hover{background:var(--btn-hover)}
/* окна (диалоги) */
.dlg-layer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.28)}
.dlg{position:fixed;z-index:91;background:var(--dlg-bg);color:var(--text);border:1px solid var(--menu-border);box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px)}
.dlg-title{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px;background:var(--dlg-head);cursor:move;user-select:none;font-size:12.5px}
.dlg-title button{width:28px;height:24px;display:grid;place-items:center}
.dlg-title button:hover{background:var(--cancel)}
.dlg-body{flex:1;min-height:0;overflow:auto}
.dlg-actions{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--frame)}
.dlg-btn{min-width:84px;height:26px;padding:0 12px;background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text)}
.dlg-btn:hover{border-color:var(--select-line)}
.dlg-btn.primary{border-color:var(--select-line)}
.set-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:340px}
.set-tree{border-right:1px solid var(--frame);overflow:auto;padding:4px 0;background:var(--panel)}
.set-tree button{display:block;width:100%;text-align:left;padding:4px 8px;white-space:nowrap;font-size:12.5px}
.set-tree button.grp{font-weight:600}
.set-tree button.sub{padding-left:24px}
.set-tree button[aria-selected="true"]{background:var(--tree-sel)}
.set-pane{padding:14px 16px;font-size:12.5px}
.set-pane h4{margin:0 0 10px;font-size:13px;font-weight:600}
.set-pane fieldset{border:1px solid var(--field-border);padding:8px 12px 10px;margin:0 0 12px}
.set-pane legend{padding:0 4px;color:var(--text-muted)}
.set-pane label{display:flex;align-items:center;gap:8px;height:24px}
.set-pane .muted-note{padding:0}
.tol-win{position:fixed;z-index:85;width:300px;background:var(--panel);border:1px solid var(--frame);box-shadow:0 10px 28px var(--shadow)}
.tol-win .tol-head{height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel-head);font-size:12.5px;letter-spacing:.06em;position:relative;cursor:move;user-select:none}
.tol-win .tol-head button{position:absolute;right:2px;top:3px;width:24px;height:24px;display:grid;place-items:center}
.tol-win .pp-row{grid-template-columns:108px minmax(0,1fr) 8px}
.tol-win .tol-foot{display:flex;justify-content:flex-end;padding:8px 10px 10px}
.tol-win .chk{display:flex;align-items:center;gap:6px;padding:4px 10px 0 18px}

/* ── вкладки документов ── */
.document-tabs{display:flex;align-items:end;gap:2px;background:var(--tabs);border-top:1px solid var(--frame);border-bottom:1px solid var(--frame);padding:0 0 0 1px;min-width:0}
.home-btn,.home-caret{height:24px;display:grid;place-items:center}
.home-btn{width:26px}.home-caret{width:16px;margin-right:6px}
.home-btn:hover,.home-caret:hover{background:var(--btn-hover)}
.doc-tab{height:24px;min-width:0;max-width:260px;display:flex;align-items:center;gap:6px;padding:0 6px 0 7px;background:var(--tab-active);color:var(--tab-active-text);font-size:12.5px;white-space:nowrap}
.doc-tab .ic{color:var(--tab-active-text)}
.doc-tab span{overflow:hidden;text-overflow:ellipsis}
.doc-tab .tab-x{width:18px;height:18px;display:grid;place-items:center;margin-left:6px}
.app[data-mode="sketch"] .document-tabs{border-bottom:3px solid var(--sketch-accent)}
.app[data-mode="sketch"] .doc-tab{box-shadow:inset 0 -2px 0 var(--sketch-accent)}
.proto-tools{margin-left:auto;display:flex;align-items:center;gap:4px;height:26px;padding:0 4px}
.chip{height:20px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--text-dim);border-radius:10px;font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--text-muted)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--st-impl)}
.chip .dots{display:flex;gap:2px}.chip .dots i{width:6px;height:6px;border-radius:50%;display:block}
.icon-btn{width:24px;height:22px;display:grid;place-items:center;border-radius:2px}
.icon-btn:hover{background:var(--btn-hover)}

/* ── инструментальная область ── */
.instrument-area{display:flex;background:var(--instr);min-width:0;overflow:hidden}
.toolsets{width:120px;flex:none;display:grid;grid-template-rows:25px 25px 25px 18px;border-right:1px solid var(--instr-sep)}
.toolset{display:flex;align-items:center;gap:5px;padding:0 3px;text-align:left;font-size:11.5px;line-height:11px;height:25px}
.toolset span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toolset:hover{background:var(--btn-hover)}
.toolset[aria-pressed="true"]{background:var(--toolset-active)}
.toolset-more{display:grid;place-items:center;background:var(--instr-label);color:var(--text-muted)}
.toolset-more:hover{color:var(--text)}
.command-ribbon{flex:1;display:flex;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.cmd-panel{flex:none;display:grid;grid-template-rows:75px 18px;border-right:1px solid var(--instr-sep);min-width:0}
.cmd-panel-body{display:flex;gap:1px;padding:0 1px}
.cmd-col{display:flex;flex-direction:column}
.cmd-panel-label{display:flex;align-items:center;gap:3px;background:var(--instr-label);color:var(--text-muted);font-size:11px;padding:0 3px 0 6px;min-width:0;width:0;min-width:100%}
.cmd-panel-label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.cmd-panel-label .caret{width:9px;height:9px;flex:none}
.grip{width:4px;height:11px;flex:none;background-image:radial-gradient(circle,var(--text-dim) 1px,transparent 1.3px);background-size:4px 4px;opacity:.85}
.btn-t,.btn-i{position:relative;height:25px;display:flex;align-items:center;border-radius:1px}
.btn-t{width:120px;gap:4px;padding:0 3px;text-align:left;font-size:11.5px;line-height:11px}
.btn-t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-i{width:26px;justify-content:center}
.btn-t:hover,.btn-i:hover{background:var(--btn-hover)}
.btn-t.on,.btn-i.on,.btn-t:active,.btn-i:active{background:var(--btn-press)}
.btn-t.on span{color:var(--tab-active-text)}
.btn-t.dim,.btn-i.dim{opacity:.45}
/* ◢ в углу значка — у команды есть варианты (как в КОМПАСе); щелчок по нему или правая кнопка открывают список */
.btn-t .var,.btn-i .var{position:absolute;width:10px;height:10px;top:13px;cursor:pointer}
.btn-t .var{left:12px}.btn-i .var{left:15px}
.btn-t .var::after,.btn-i .var::after{content:"";position:absolute;right:1px;bottom:1px;border-left:5px solid transparent;border-bottom:5px solid var(--icon)}
.btn-t .var:hover::after,.btn-i .var:hover::after{border-bottom-color:var(--select-line)}

/* статусы команд ASA-CAD (реестр spec/ui/command-registry.v1.json) */
.show-status [data-st]::after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--dot,transparent);box-shadow:0 0 0 1px var(--instr)}
.show-status [data-st="implemented"]{--dot:var(--st-impl)}
.show-status [data-st="planned"]{--dot:var(--st-plan)}
.show-status [data-st="deferred"]{--dot:var(--st-def)}
.show-status [data-st="none"]::after{background:transparent;border:1.5px solid var(--st-none);width:6px;height:6px}

/* ── основная область ── */
.content{display:grid;grid-template-columns:26px 310px 1px minmax(0,1fr);min-height:0;border-top:1px solid var(--frame);position:relative}
.content.collapsed{grid-template-columns:26px 0 0 minmax(0,1fr)}
.content.collapsed .management-panel{display:none}
.management-rail{background:var(--rail);display:flex;flex-direction:column;border-right:1px solid var(--frame)}
.rail-tab{width:26px;height:25px;display:grid;place-items:center}
.rail-tab:hover{background:var(--btn-hover)}
.rail-tab[aria-selected="true"]{background:var(--rail-active)}
.management-panel{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.splitter{background:var(--frame)}
.panel-head{height:20px;flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--panel-head);padding:0 3px 0 4px;font-size:12px}
.panel-head button{width:20px;height:18px;display:grid;place-items:center}
.tree-toolbar{height:30px;flex:none;display:flex;align-items:center;gap:0;padding:0 2px}
.tree-toolbar button{width:30px;height:26px;display:grid;place-items:center}
.tree-toolbar button:hover{background:var(--btn-hover)}
.tree-search{height:25px;flex:none;display:flex;gap:2px;margin:0 0 3px}
.tree-search button{width:26px;display:grid;place-items:center}
.tree-search label{flex:1;display:flex;align-items:center;gap:5px;background:var(--field);padding:0 6px;min-width:0}
.tree-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--field-text)}
.tree-search input::placeholder{color:var(--text-muted)}
.tree-rows{flex:1;min-height:0;overflow:auto}
.tree-row{display:grid;grid-template-columns:32px 36px minmax(0,1fr);height:26px;border-bottom:1px solid var(--tree-line);cursor:default}
.tree-row .c-eye,.tree-row .c-aux{background:var(--tree-gutter);display:grid;place-items:center;color:var(--text-muted);font-size:14px}
.tree-row .c-main{display:flex;align-items:center;gap:4px;min-width:0;padding-right:6px}
.tree-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tree-row:hover .c-main{background:color-mix(in srgb,var(--tree-sel) 45%,transparent)}
.tree-row.sel .c-main{background:var(--tree-sel)}
.tree-row.hidden-obj .lbl{color:var(--text-dim)}
.eye-btn{width:26px;height:22px;display:grid;place-items:center}
.eye-btn .ic{color:var(--text-muted)}
.tri{width:14px;height:20px;display:grid;place-items:center;flex:none}
.tri svg{width:9px;height:9px;transition:transform .12s}
.tri[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tri-sp{width:14px;flex:none}
.odot{font-size:9px;color:var(--text);margin:0 1px}
.tree-end{height:3px;background:var(--select-line)}
.tree-lower{height:172px;flex:none;display:flex;flex-direction:column;border-top:4px solid var(--frame)}
.lower-tabs{height:30px;display:flex;align-items:stretch;border-bottom:2px solid var(--frame)}
.lower-tabs button{width:36px;display:grid;place-items:center}
.lower-tabs button[aria-selected="true"]{background:var(--rail-active)}
.muted-note{padding:14px 12px;color:var(--text-dim);font-size:12px}

/* панель параметров */
.pp-cmd{height:26px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 4px;font-size:11.5px}
.pp-cmd strong{font-weight:400;flex:1}
.pp-cmd button{width:26px;height:22px;display:grid;place-items:center}
.pp-tabs{height:34px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:2px solid var(--frame)}
.pp-tabs .tab{width:30px;height:28px;display:grid;place-items:center}
.pp-tabs .tab[aria-selected="true"]{background:var(--rail-active)}
.pp-tabs .spacer{flex:1}
.pp-ok,.pp-cancel{width:30px;height:28px;display:grid;place-items:center}
.pp-ok .ic{color:var(--ok)} .pp-cancel .ic{color:var(--cancel)}
.pp-ok:disabled{opacity:.35;cursor:default}
.pp-ok:hover:not(:disabled),.pp-cancel:hover{background:var(--btn-hover)}
.pp-body{flex:1;min-height:0;overflow:auto;padding:6px 0 10px}
.pp-row{display:grid;grid-template-columns:116px minmax(0,1fr) 30px;align-items:center;column-gap:4px;min-height:30px;padding:2px 0}
.pp-label{text-align:right;font-size:12px;line-height:1.15;color:var(--text)}
.pp-label small{display:block;color:var(--text-dim);font-size:11.5px}
.pp-label a,.pp-link{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.pp-iconset{display:flex;gap:4px}
.pp-iconset button{width:28px;height:26px;display:grid;place-items:center}
.pp-iconset button:hover{background:var(--btn-hover)}
.pp-iconset button[aria-pressed="true"]{background:var(--rail-active)}
.pp-field{height:24px;width:100%;background:var(--field);border:1px solid var(--field-border);color:var(--field-text);padding:0 6px;outline:0;min-width:0}
.pp-field.invalid{border-color:var(--cancel);box-shadow:0 0 0 1px var(--cancel)}
.pp-fieldwrap{display:flex;align-items:center;background:var(--field);border:1px solid var(--field-border);height:24px;min-width:0}
.pp-fieldwrap .v{flex:1;padding:0 6px;color:var(--field-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-fieldwrap .v.ph{color:var(--text-muted);font-style:italic}
.pp-fieldwrap button{width:22px;height:22px;display:grid;place-items:center}
.pp-side{width:28px;height:26px;display:grid;place-items:center}
.pp-side:hover{background:var(--btn-hover)}
.pp-list{height:102px;background:var(--field);border:1px solid var(--field-border);padding:4px 6px;color:var(--field-text);overflow:auto}
.pp-list div{height:24px;display:flex;align-items:center}
.pp-select{outline:1px dashed var(--select-line);outline-offset:-1px;margin:2px 0}
.pp-row.hl{background:var(--row-hl)}
.pp-row.hl .pp-label{color:#fff}
.pp-row.hl .pp-side .ic{color:#fff}
.pp-lbl-drop{display:inline-flex;align-items:center;gap:4px}
.pp-lbl-drop svg{width:9px;height:9px}
.toggle{width:64px;height:22px;display:flex;border:1px solid var(--field-border);background:var(--toggle-track);padding:0}
.toggle i{flex:1;display:block}
.toggle .knob{background:var(--toggle-knob)}
.toggle .ring{display:grid;place-items:center}
.toggle .ring::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--toggle-knob)}
.toggle[aria-checked="true"] .knob{background:var(--row-hl)}
.toggle[aria-checked="true"]{flex-direction:row-reverse}
.pp-section{margin-top:10px}
.pp-section>button{width:100%;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--section);font-size:12.5px}
.pp-section>button svg{width:10px;height:10px;transition:transform .12s}
.pp-section>button[aria-expanded="false"] svg{transform:rotate(-90deg)}
.pp-section .inner{padding:6px 0 2px}
.pp-msg{flex:none;display:grid;grid-template-columns:22px 1fr 18px;gap:4px;align-items:start;background:var(--msg);padding:8px 6px 9px;font-size:12.5px;line-height:1.35;border-top:1px solid var(--frame)}
.pp-msg button{width:18px;height:18px;display:grid;place-items:center}
.var-table{width:100%;border-collapse:collapse;font-size:12px}
.var-table th{font-weight:400;text-align:left;color:var(--text-muted);background:var(--tree-gutter);padding:4px 6px;border-bottom:1px solid var(--frame)}
.var-table td{padding:4px 6px;border-bottom:1px solid var(--tree-line)}

/* ── графическая область ── */
.work-area{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(var(--vp-top),var(--vp-bottom))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.qa{position:absolute;top:0;left:16px;display:flex;height:25px;background:var(--qa);border:1px solid var(--frame);border-top:0;z-index:5;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa .qgrip{width:10px;flex:none;background-image:radial-gradient(circle,var(--text-dim) 1px,transparent 1.3px);background-size:4px 4px;background-position:3px 5px;background-repeat:repeat;margin:4px 0}
.qa-b{height:24px;width:26px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px}
.qa-split{display:flex;flex:none;width:47px;height:24px}.qa-split.w46{width:46px}
.qa-split .qa-b{width:29px}
.qa-split .qa-caret{width:18px;height:24px;display:grid;place-items:center;flex:none}
.qa-split.w46 .qa-caret{width:17px}
.qa-split .qa-caret .ic{width:8px;height:8px}
.qa-split .qa-caret:hover,.qa-split .qa-caret[aria-expanded="true"]{background:var(--btn-hover)}
.qa-b:hover{background:var(--btn-hover)}
.qa-b.on{background:var(--qa-active)} .qa-b.on .ic{color:var(--qa-active-icon)}
.qa-b.sk-on .ic{color:var(--sketch-accent)}
.qa-sep{width:1px;flex:none;background:var(--frame)}
.qa-ok .ic{color:var(--ok)} .qa-cancel .ic{color:var(--cancel)}
.sketch-exit{position:absolute;top:32px;right:16px;width:46px;height:46px;display:grid;place-items:center;background:var(--rail-active);border:1px solid var(--frame);z-index:5}
.sketch-exit .ic{color:var(--sketch-accent)}
.sketch-exit:hover{outline:2px solid var(--sketch-accent);outline-offset:-2px}
.triad{position:absolute;left:4px;bottom:4px;width:96px;height:96px;pointer-events:none}
.legend{position:absolute;right:16px;bottom:16px;width:270px;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--frame);box-shadow:0 8px 24px var(--shadow);padding:10px 12px 11px;z-index:6;font-size:12px}
.legend h3{margin:0 0 6px;font-size:12.5px;font-weight:600}
.legend .lrow{display:flex;align-items:center;gap:8px;height:21px}
.legend .lrow b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.legend .sw{width:9px;height:9px;border-radius:50%;flex:none}
.legend .sw.none{border:1.5px solid var(--st-none)}
.legend p{margin:8px 0 0;color:var(--text-dim);font-size:11.5px;line-height:1.4}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,8px);background:var(--toast-bg);color:var(--toast-text);padding:8px 14px;border-radius:3px;font-size:12.5px;max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:8;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.snap-lbl{position:absolute;z-index:7;background:var(--tip-bg);color:var(--tip-text);border:1px solid var(--tip-border);padding:1px 6px;font-size:11.5px;pointer-events:none;white-space:nowrap}
.xy-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.xy-pair label{display:flex;align-items:center;gap:4px;color:var(--text-muted);font-size:11.5px;min-width:0}
.xy-pair .pp-field{min-width:0}
.sk-hint{margin:12px 10px 0;color:var(--text-dim);font-size:11.5px;line-height:1.4}
.gl-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted);padding:24px;text-align:center}
.pp-lbl-drop{cursor:pointer}
.pp-lbl-drop:hover{text-decoration:underline}
.pp-fieldwrap button[aria-expanded="true"]{background:var(--btn-hover)}

@media (max-width: 760px){
  .title-tools{display:none}

  .content,.content.collapsed{grid-template-columns:26px 0 0 minmax(0,1fr)}
  .management-panel{position:absolute;left:26px;top:0;bottom:0;width:min(310px,calc(100% - 42px));z-index:20;box-shadow:6px 0 18px var(--shadow)}
  .content.collapsed .management-panel{display:none}
  .splitter{display:none}
  .legend{width:230px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

  <div class="tip" id="tip" role="tooltip" hidden></div>

/* префиксы частей значка: F — заливка цветом значка, D — пунктир; объёмные значки:
   f — передняя грань, t — верхняя (светлая), s — боковая (тёмная), k — отверстие/полость,
   a — элемент операции (акцент), p — полупрозрачная плоскость, A — линия-акцент, B — пунктир-акцент */
const PART={
  F:d=>`<path d="${d}" fill="currentColor" stroke="none"/>`,
  D:d=>`<path d="${d}" stroke-dasharray="2.2 2"/>`,
  f:d=>`<path d="${d}" fill="var(--sf-front)"/>`,
  t:d=>`<path d="${d}" fill="var(--sf-top)"/>`,
  s:d=>`<path d="${d}" fill="var(--sf-side)"/>`,
  k:d=>`<path d="${d}" fill="var(--sf-dark)"/>`,
  a:d=>`<path d="${d}" fill="var(--sf-acc)"/>`,
  p:d=>`<path d="${d}" fill="var(--sf-acc)" fill-opacity=".28" stroke="var(--sf-acc)"/>`,
  A:d=>`<path d="${d}" fill="none" stroke="var(--sf-acc)" stroke-width="1.9"/>`,
  B:d=>`<path d="${d}" fill="none" stroke="var(--sf-acc)" stroke-dasharray="2 1.6" stroke-width="1.3"/>`
};
function svg(name,size=16,cls=''){
  const parts=IC[name]||IC.ts_generic;
  let solid=false;
  const inner=parts.map(p=>{
    const m=/^([FDftskapAB]):/.exec(p);
    if(!m)return `<path d="${p}"/>`;
    if('ftskapAB'.includes(m[1]))solid=true;
    return PART[m[1]](p.slice(2));
  }).join('');
  const stroke=solid?'stroke="var(--sf-line)" stroke-width="1.15"':'stroke="currentColor" stroke-width="1.7"';
  return `<svg class="ic ${cls}${solid?' ic-solid':''}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" ${stroke} stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${inner}</svg>`;

function treeRows(){
  const rows=[],sel=state.sel;
  const isSel=(t,id)=>sel&&sel.type===t&&(id===undefined||sel.id===id);
  rows.push({key:'root',depth:0,label:`Деталь (Тел-${doc.features.length?1:0})`,icon:'part',tri:state.exp.root});
  if(!state.exp.root)return rows;
  rows.push({key:'origin',depth:1,label:'Начало координат',icon:'origin',tri:state.exp.origin,eye:true,dot:true,selected:isSel('origin')});
  if(state.exp.origin){
    [['xy','Плоскость XY'],['zx','Плоскость ZX'],['zy','Плоскость ZY']].forEach(([k,l])=>rows.push({key:'plane:'+k,depth:2,label:l,icon:'planeTree',iconCls:'ic-'+k,eye:state.vis[k],selected:isSel('plane',k)}));
    [['ax','Ось X','ic-zy'],['ay','Ось Y','ic-zx'],['az','Ось Z','ic-xy']].forEach(([k,l,cl])=>rows.push({key:'axis:'+k,depth:2,label:l,icon:'axis',iconCls:cl,eye:state.vis[k],selected:isSel('axis',k)}));
  }
  const skRow=(s,depth)=>({key:'sketch:'+s.id,depth,label:((s.entities||[]).length?'(-)':'')+s.name,icon:'ts_sketch',aux:'∈',eye:s.visible,selected:isSel('sketch',s.id)||state.editSketch===s.id});
  doc.sketches.filter(s=>!s.used).forEach(s=>rows.push(skRow(s,1)));
  doc.features.forEach(f=>{
    rows.push({key:'feature:'+f.id,depth:1,label:f.name+(f.invalid?' — нет профиля':''),icon:'extrude',tri:!!state.exp[f.id],eye:f.visible,selected:isSel('feature',f.id)});
    if(state.exp[f.id]){const s=sketchById(f.sketchId);if(s)rows.push(skRow(s,2));}
  });
  return rows;
}

/* ───────── команды ───────── */
function snapshot(){history.push(JSON.stringify(doc));if(history.length>50)history.shift();future.length=0;}
function canHistory(){return state.mode==='idle'||(state.mode==='sketch'&&!(state.sk.tool&&state.sk.step>0));}
function afterHistory(){
  state.sel=null;state.sk.sel.clear();state.sk.hoverEnt=null;state.sk.hoverVertex=null;
  if(state.mode==='sketch'&&!sketchById(state.editSketch))finishSketch(true);
  refresh();
}
function undo(){if(!canHistory()){toast('Сначала завершите или прервите команду');return;}if(!history.length){toast('Отменять нечего');return;}future.push(JSON.stringify(doc));doc=JSON.parse(history.pop());afterHistory();toast('Действие отменено');}
function redo(){if(!canHistory()){toast('Сначала завершите или прервите команду');return;}if(!future.length){toast('Повторять нечего');return;}history.push(JSON.stringify(doc));doc=JSON.parse(future.pop());afterHistory();toast('Действие повторено');}
function explain(id,label){toast(`«${label}» в прототипе не работает · ${ST_TEXT[status(id)]}`);}
function runCommand(id,label){
  closePopups();
  switch(id){
    case 'part.extrude':return startExtrude();
    case 'part.sketch.create':return sketchButton();
    case 'sketch.finish':return finishSketch();
    case 'system.undo':return undo();
    case 'system.redo':return redo();
    case 'view.fit':return scene3d.fit();
    case 'view.iso':return scene3d.view('iso');
  }
  if(TOOL_OF[id]){
    if(state.mode==='sketch'){sketcher.start(TOOL_OF[id]);return;}
    const s=state.sel;
    if(state.mode==='idle'&&s&&s.type==='plane'){newSketchOn(s.id);sketcher.start(TOOL_OF[id]);return;}
    toast(`«${label}» рисует в эскизе: выберите плоскость в дереве или в окне и нажмите команду ещё раз`);return;
  }
  if(id==='sketch.entity.delete'){if(state.mode==='sketch')sketcher.del();else toast('«Удалить элемент» работает внутри эскиза');return;}
  if(state.mode!=='sketch'&&/^(sketch\.|constraint\.|dimension\.)/.test(id||'')&&id!=='sketch.finish'){
    toast(`«${label}» работает внутри эскиза: выберите плоскость и нажмите «Создать эскиз»`);return;
  }
  explain(id,label);
}
function selectedSketch(){const s=state.sel;return s&&s.type==='sketch'?sketchById(s.id):null;}
function startExtrude(){
  if(state.mode==='extrude')return;
  let sk=null;
  if(state.mode==='sketch'){sk=sketchById(state.editSketch);finishSketch(true);}
  sk=sk||selectedSketch()||doc.sketches.slice().reverse().find(s=>!s.used&&sketchShapes(s).length);
  if(!sk){toast('Нет эскиза с замкнутым контуром: создайте эскиз и нарисуйте контур');refresh();return;}
  if(sk.used){toast(`«${sk.name}» уже использован в операции — отредактируйте его двойным щелчком в дереве`);refresh();return;}
  if(!sketchShapes(sk).length){toast(`В «${sk.name}» нет замкнутого контура`);refresh();return;}
  state.cancelAwait=null;
  state.mode='extrude';
  state.tol=null;
  state.op={sketchId:sk.id,distance:10,distanceText:'10',angle:0,symmetric:false,reverse:false,second:false,thin:false,result:0,method:0,open:{thin:true,scope:false,props:false}};
  state.prevTab=state.panelTab==='params'?'tree':state.panelTab;state.panelTab='params';state.panelOpen=true;
  refresh();
}
function confirmExtrude(){
  const o=state.op;if(!o||!(o.distance>0))return;
  snapshot();
  doc.seq.extrude++;const n=doc.seq.extrude;
  doc.features.push({id:'f'+n,name:`Элемент выдавливания:${n}`,sketchId:o.sketchId,distance:o.distance,symmetric:o.symmetric,reverse:o.reverse,through:o.method===1,visible:true});
  const s=sketchById(o.sketchId);s.used=true;s.visible=false;
  state.mode='idle';state.op=null;state.panelTab=state.prevTab||'tree';state.sel={type:'feature',id:'f'+n};

function cancelCommand(){
  if(state.mode==='extrude'||state.mode==='awaitPlane'){state.mode='idle';state.op=null;state.panelTab=state.prevTab||'tree';closeTol();closePopups();refresh();}
}
function sketchButton(){
  if(state.mode==='sketch')return finishSketch();

  const s=state.sel;
  if(s&&s.type==='plane')return newSketchOn(s.id);
  if(s&&s.type==='sketch'){const sk=sketchById(s.id);if(sk)return editSketch(sk.id);}
  state.mode='awaitPlane';state.prevTab=state.panelTab==='params'?'tree':state.panelTab;state.panelTab='params';state.panelOpen=true;
  if(!state.exp.origin)state.exp.origin=true;

}
function newSketchOn(plane){
  snapshot();doc.seq.sketch++;const n=doc.seq.sketch;
  doc.sketches.push({id:'s'+n,name:`Эскиз:${n}`,plane,entities:[],visible:true,used:false});
  state.mode='idle';state.panelTab=state.prevTab==='params'?'tree':(state.prevTab||'tree');

function editSketch(id){
  const sk=sketchById(id);
  if(state.mode==='sketch')finishSketch(true);
  state.mode='sketch';state.editSketch=id;state.sel={type:'sketch',id};
  sketcher.reset();state.sk.sel.clear();state.sk.hoverEnt=null;state.sk.hoverVertex=null;state.sk.cursor=null;state.sk.snap=null;
  if(state.toolset!=='sketch')state.prevToolset=state.toolset;
  state.toolset='sketch';if(state.panelTab==='params')state.panelTab='tree';
  scene3d.rememberView();scene3d.view(sk.plane);
  refresh();
}
function finishSketch(silent){
  if(state.mode!=='sketch')return;
  sketcher.reset();state.sk.sel.clear();state.sk.hoverEnt=null;state.sk.hoverVertex=null;state.sk.snap=null;
  scene3d.snapLabel(null);scene3d.setCursor('default');
  if(state.panelTab==='params')state.panelTab=state.prevSkTab||'tree';
  state.mode='idle';state.editSketch=null;state.toolset=state.prevToolset||'solid';

}
function selectKey(key){
  const [t,id]=key.split(':');

  if(t==='root'){state.sel=null;}
  else if(t==='origin')state.sel={type:'origin'};
  else state.sel={type:t,id};

}

/* ───────── выпадающие окна: меню, подменю по наведению, списки стрелочек ───────── */
let pops=[];          // открытые окна по уровням вложенности
let openDrop=null;    // раскрытая стрелочка панели быстрого доступа
let hoverTimer=0,dlg=null,tolWin=null;
const isDis=it=>typeof it.d==='function'?it.d():!!it.d;
function itemHTML(it,idx){
  if(it===S)return '<hr>';
  const dis=isDis(it),on=it.on?it.on():false,hasCk=!!it.ck,ck=hasCk?it.ck():false;
  const icon=it.i?(on?`<span class="mi-on">${svg(it.i,15)}</span>`:svg(it.i,15)):(ck?'<span class="mi-ck">✓</span>':'<span></span>');
  const st=it.id?status(it.id):(it.s||it.a?null:'none');
  const role=hasCk?`menuitemcheckbox" aria-checked="${ck}`:(it.on?`menuitemcheckbox" aria-checked="${on}`:'menuitem');
  return `<button type="button" class="mi" role="${role}" data-idx="${idx}"${dis?' aria-disabled="true"':''}${it.s?' aria-haspopup="menu" aria-expanded="false"':''}${st?` data-st="${st}"`:''}>${icon}<span class="mi-l">${esc(it.l)}</span><span class="mi-k">${esc(it.k||'')}</span><span class="mi-ar">${it.s?'▶':''}</span></button>`;
}
function openPop(items,rect,level=0,opts={}){
  removePops(level);
  const el=document.createElement('div');
  el.className='pop'+(opts.cls?' '+opts.cls:'');el.setAttribute('role','menu');
  el.innerHTML=opts.html||items.map(itemHTML).join('');
  popLayer.appendChild(el);
  const vw=innerWidth,vh=innerHeight,w=el.offsetWidth;let h=el.offsetHeight;
  const sub=level>0&&!opts.below;
  let x=sub?rect.right-2:rect.left,y=sub?rect.top-2:rect.bottom;
  if(x+w>vw-4)x=sub?Math.max(4,rect.left-w+2):Math.max(4,vw-4-w);
  if(y+h>vh-4){
    if(sub)y=Math.max(4,vh-4-h);
    else if(vh-4-y>=160)el.style.maxHeight=(vh-4-y)+'px';
    else y=Math.max(4,vh-4-h);
  }
  if(h>vh-8){el.style.maxHeight=(vh-8)+'px';y=Math.min(y,4);}
  el.style.left=x+'px';el.style.top=y+'px';
  pops[level]={el,items,level};
  el.addEventListener('mouseover',ev=>{
    const b=ev.target.closest('.mi');if(!b)return;
    const it=items[+b.dataset.idx];clearTimeout(hoverTimer);
    hoverTimer=setTimeout(()=>{
      if(!pops[level]||pops[level].el!==el)return;
      if(it&&it.s&&!isDis(it)){if(!b.classList.contains('open'))openSub(level,b,it);}
      else{closePops(level+1);el.querySelectorAll('.mi.open').forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false');});}
    },it&&it.s?120:220);
  });
  el.addEventListener('click',ev=>{
    ev.stopPropagation();
    if(opts.onClick&&opts.onClick(ev))return;
    const b=ev.target.closest('.mi');if(b)activate(level,b,items[+b.dataset.idx]);
  });
  return el;
}
function openSub(level,btn,it){
  pops[level].el.querySelectorAll('.mi.open').forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false');});
  btn.classList.add('open');btn.setAttribute('aria-expanded','true');
  openPop(typeof it.s==='function'?it.s():it.s,btn.getBoundingClientRect(),level+1);
}
function focusFirst(level){const p=pops[level];if(p){const b=p.el.querySelector('.mi:not([aria-disabled="true"])');if(b)b.focus();}}
function activate(level,btn,it){
  if(!it||isDis(it))return;
  if(it.s){openSub(level,btn,it);focusFirst(level+1);return;}
  if(it.keep){
    if(it.a)it.a();
    const p=pops[level];if(p){const i=+btn.dataset.idx;p.el.innerHTML=p.items.map(itemHTML).join('');const nb=p.el.querySelector(`[data-idx="${i}"]`);if(nb)nb.focus();}
    renderQA();renderPanel();scene3d.sync();return;
  }
  closeAllPops();closePanelDrop();
  if(it.a)it.a();else if(it.id)runCommand(it.id,it.l);else toast(`«${it.l}» в прототипе не работает`);
}
function removePops(from){
  for(let i=pops.length-1;i>=from;i--){if(pops[i])pops[i].el.remove();}
  pops.length=Math.min(pops.length,from);
}
function closePops(from=0){
  removePops(from);
  if(from===0){
    clearTimeout(hoverTimer);
    if(state.menu){state.menu=null;markMenu();}
    if(openDrop){openDrop=null;qaEl.querySelectorAll('[data-qdrop]').forEach(b=>b.setAttribute('aria-expanded','false'));}
  }
}
function closeAllPops(){closePops(0);}
function closePopups(){closeAllPops();closePanelDrop();searchRes.hidden=true;}
function markMenu(){menuEl.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.menu===state.menu)));}

/* главное меню: щелчок открывает, наведение на соседний пункт переключает (как в КОМПАСе) */
function openMainMenu(name){
  const btn=menuEl.querySelector(`[data-menu="${name}"]`);if(!btn||!MENUS[name])return;

function stepMenu(dir){

menuEl.addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b)return;e.stopPropagation();if(state.menu===b.dataset.menu)closeAllPops();else openMainMenu(b.dataset.menu);});

function normalView(){

qaEl.addEventListener('click',e=>{
  const cb=e.target.closest('[data-qdrop]');

    case 'snap':state.sk.snapOn=!state.sk.snapOn;renderQA();return toast(state.sk.snapOn?'Привязки включены':'Привязки выключены');

/* раскрытие панели инструментов по ▾: панель вырастает вниз и показывает все команды, ▲ сворачивает */

/* окна: «Параметры», «Информация о документе», «О программе», «Допуск» */
function makeDraggable(win,handle){
  handle.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('button'))return;
    const r=win.getBoundingClientRect(),dx=ev.clientX-r.left,dy=ev.clientY-r.top;handle.setPointerCapture(ev.pointerId);

    const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);
  });
}

/* ───────── геометрия эскиза: сущности хранятся в координатах плоскости эскиза (u, v), мм ─────────
   line {a,b} · arc {c,r,a0,a1} (против часовой от a0 к a1) · circle {c,r} · point {p} · cline {a,b} — вспомогательная прямая */
const TAU=Math.PI*2;
const PLANE_BASIS={xy:{U:[1,0,0],V:[0,1,0],N:[0,0,1]},zx:{U:[1,0,0],V:[0,0,1],N:[0,-1,0]},zy:{U:[0,1,0],V:[0,0,1],N:[1,0,0]}};
const arcSweep=e=>{const s=((e.a1-e.a0)%TAU+TAU)%TAU;return s<1e-9?TAU:s;};
const arcPt=(e,a)=>[e.c[0]+e.r*Math.cos(a),e.c[1]+e.r*Math.sin(a)];
const segEnds=e=>e.type==='arc'?[arcPt(e,e.a0),arcPt(e,e.a1)]:[e.a,e.b];
const ptKey=p=>Math.round(p[0]*1e4)+','+Math.round(p[1]*1e4);
const dist2=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
const r3=x=>Math.round(x*1000)/1000;
function polyArea(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function inPoly(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}return ins;}
function segSample(s,fwd){if(s.type!=='arc')return [fwd?s.a:s.b];const sw=arcSweep(s),n=Math.max(4,Math.ceil(sw/(Math.PI/24))),out=[];for(let i=0;i<n;i++){const t=i/n;out.push(arcPt(s,s.a0+sw*(fwd?t:1-t)));}return out;}
function entVertices(e){
  if(e.type==='line'||e.type==='cline')return [e.a,e.b];
  if(e.type==='arc')return [...segEnds(e),e.c];
  if(e.type==='circle')return [e.c];
  if(e.type==='point')return [e.p];
  return [];
}
/* замкнутые контуры: цепочки отрезков и дуг, где в каждой вершине сходятся ровно два элемента; окружности — отдельные контуры */
function profileLoops(sk){
  const ents=(sk&&sk.entities||[]).filter(e=>!e.aux);
  const loops=[];
  ents.filter(e=>e.type==='circle').forEach(e=>{const poly=[];for(let i=0;i<48;i++){const a=i/48*TAU;poly.push([e.c[0]+e.r*Math.cos(a),e.c[1]+e.r*Math.sin(a)]);}loops.push({poly,segs:[{s:e,fwd:true,circle:true}]});});
  const segs=ents.filter(e=>e.type==='line'||e.type==='arc');

    const th=Math.acos(Math.max(-1,Math.min(1,d1[0]*d2[0]+d1[1]*d2[1])));
    if(th<1e-3||Math.PI-th<1e-3){toast('Отрезки лежат на одной прямой');return;}
    let T1,T2,extra;
    if(s.tool==='fillet'){
      const r=s.opts.filletR,t=r/Math.tan(th/2);
      if(!(r>0)||t>=len1-1e-6||t>=len2-1e-6){toast('Радиус слишком велик для этих отрезков');return;}
      const bis=[d1[0]+d2[0],d1[1]+d2[1]],bl=Math.hypot(bis[0],bis[1]),hd=r/Math.sin(th/2);
      const C=[r3(V[0]+bis[0]/bl*hd),r3(V[1]+bis[1]/bl*hd)];
      let a=Math.atan2(V[1]+d1[1]*t-C[1],V[0]+d1[0]*t-C[0]),b=Math.atan2(V[1]+d2[1]*t-C[1],V[0]+d2[0]*t-C[0]);
      extra={type:'arc',c:C,r,a0:a,a1:b,aux:false};
      T1=arcPt(extra,a);T2=arcPt(extra,b);          // концы отрезков ставим точно в концы дуги — контур замкнётся
      if(((b-a)%TAU+TAU)%TAU>Math.PI){extra.a0=b;extra.a1=a;}
    }else{
      const t=s.opts.chamferD;
      if(!(t>0)||t>=len1-1e-6||t>=len2-1e-6){toast('Длина фаски больше длины отрезка');return;}
      T1=[r3(V[0]+d1[0]*t),r3(V[1]+d1[1]*t)];T2=[r3(V[0]+d2[0]*t),r3(V[1]+d2[1]*t)];
      extra={type:'line',a:T1,b:T2,aux:false};
    }
    snapshot();
    L1[e1]=T1;L2[e2]=T2;
    doc.seq.ent=(doc.seq.ent||0)+1;extra.id='e'+doc.seq.ent;sk().entities.push(extra);
    refreshSketch(true);
  }
  /* правка: перенос точек и элементов, удаление, сдвиг */
  function pointRefs(ents,key){
    const out=[];
    ents.forEach(e=>{
      if(e.type==='line'||e.type==='cline'){if(ptKey(e.a)===key)out.push([e.id,'a']);if(ptKey(e.b)===key)out.push([e.id,'b']);}
      else if(e.type==='arc'){const [p,q]=segEnds(e);if(ptKey(p)===key)out.push([e.id,'a0']);if(ptKey(q)===key)out.push([e.id,'a1']);if(ptKey(e.c)===key)out.push([e.id,'c']);}
      else if(e.type==='circle'){if(ptKey(e.c)===key)out.push([e.id,'c']);}
      else if(e.type==='point'){if(ptKey(e.p)===key)out.push([e.id,'p']);}
    });
    return out;
  }
  function setRef(e,orig,which,np){
    if(which==='a0'||which==='a1'){e[which]=Math.atan2(np[1]-orig.c[1],np[0]-orig.c[0]);return;}
    e[which]=[r3(np[0]),r3(np[1])];
  }
  function translate(ids,dx,dy){
    const g=sk();if(!g||!ids.length)return;snapshot();
    g.entities.forEach(e=>{if(ids.includes(e.id)){const m=shifted(e,dx,dy);Object.assign(e,m);}});
    refreshSketch(true);
  }
  function del(){
    const s=S(),g=sk();if(!g||!s.sel.size){toast('Выделите элементы эскиза для удаления');return;}
    snapshot();const n=s.sel.size;g.entities=g.entities.filter(e=>!s.sel.has(e.id));s.sel.clear();s.hoverEnt=null;
    refreshSketch(true);toast(`Удалено элементов: ${n}`);
  }
  function hitEntity(p){
    const g=sk(),tol=8*scene3d.wpp();let best=null,bd=tol;
    (g.entities||[]).forEach(e=>{const d=entDist(e,p);if(d<bd){bd=d;best=e;}});
    return best;
  }
  function entDist(e,p){
    if(e.type==='line'||e.type==='cline'){
      const ax=e.a[0],ay=e.a[1],bx=e.b[0]-ax,by=e.b[1]-ay,L=bx*bx+by*by||1;let t=((p[0]-ax)*bx+(p[1]-ay)*by)/L;
      if(e.type==='line')t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-(ax+bx*t),p[1]-(ay+by*t));
    }
    if(e.type==='circle')return Math.abs(dist2(e.c,p)-e.r);
    if(e.type==='arc'){const a=Math.atan2(p[1]-e.c[1],p[0]-e.c[0]),rel=((a-e.a0)%TAU+TAU)%TAU;if(rel<=arcSweep(e))return Math.abs(dist2(e.c,p)-e.r);return Math.min(...segEnds(e).map(q=>dist2(q,p)));}
    if(e.type==='point')return dist2(e.p,p);

  }
  function hitVertex(p){
    const g=sk(),tol=8*scene3d.wpp();let best=null,bd=tol;
    (g.entities||[]).forEach(e=>entVertices(e).forEach(q=>{const d=dist2(q,p);if(d<bd){bd=d;best=q;}}));
    return best;
  }
  /* события мыши из 3D-вида */
  function uvOf(ev){const g=sk();return g?scene3d.uv(ev.clientX,ev.clientY,g.plane):null;}
  function onDown(ev){
    const s=S(),p=uvOf(ev);if(!p)return;
    if(s.tool){down={tool:true};return;}
    const v=hitVertex(p);
    if(v){down={kind:'vertex',start:p,v,key:ptKey(v)};return;}
    const e=hitEntity(p);
    if(e){
      if(!s.sel.has(e.id)&&!(ev.ctrlKey||ev.metaKey)){s.sel.clear();}
      down={kind:e.type==='circle'&&dist2(e.c,p)>e.r*.5?'radius':'entity',start:p,id:e.id,add:ev.ctrlKey||ev.metaKey};return;
    }
    down={kind:'box',start:p,add:ev.ctrlKey||ev.metaKey};
  }
  function onMove(ev,dragging){
    const s=S(),g=sk();if(!g)return;
    const p=uvOf(ev);if(!p)return;
    if(s.tool){
      const sn=snap(p,ev,{align:!['circle','polygon','point','fillet','chamfer'].includes(s.tool)&&!(s.tool==='arc'&&s.step!==1)?true:false,from:s.tool==='arc'&&s.step===1?s.pts[0]:undefined});
      s.cursor=sn.p;s.snap=sn;s.guides=sn.guides;
      if(s.tool==='arc'&&s.step===2)trackSweep(sn.p);
      if(s.tool==='fillet'||s.tool==='chamfer'){const c=cornerAt(p);s.snap=c?{p:c.v,kind:c.ok?'end':'center',label:c.ok?'Угол':'Нужно два отрезка'}:null;}
      scene3d.snapLabel(s.snap&&s.snap.label,ev.clientX,ev.clientY);
      updateSketchFields();scene3d.overlay();return;
    }
    if(dragging&&down){dragMove(p,ev);return;}
    const v=hitVertex(p),e=v?null:hitEntity(p);
    const hv=v||null,he=e?e.id:null;
    if((hv&&!s.hoverVertex)||(!hv&&s.hoverVertex)||(hv&&s.hoverVertex&&ptKey(hv)!==ptKey(s.hoverVertex))||he!==s.hoverEnt){s.hoverVertex=hv;s.hoverEnt=he;scene3d.overlay();}
    scene3d.setCursor(hv?'move':he?'pointer':'default');
  }
  function dragMove(p,ev){
    const s=S(),g=sk();
    if(down.kind==='box'){s.box={a:down.start,b:p};scene3d.overlay();return;}
    if(!down.began){down.began=true;snapshot();down.orig=JSON.parse(JSON.stringify(g.entities));
      if(down.kind==='entity'&&!s.sel.has(down.id)){s.sel.add(down.id);}
      if(down.kind==='vertex')down.refs=pointRefs(down.orig,down.key);
      if(down.kind==='entity'){
        const ids=new Set(s.sel);down.ids=ids;const keys=new Set();
        down.orig.filter(e=>ids.has(e.id)).forEach(e=>entVertices(e).forEach(q=>keys.add(ptKey(q))));
        down.attached=[];keys.forEach(k=>pointRefs(down.orig.filter(e=>!ids.has(e.id)),k).forEach(r=>down.attached.push(r)));
      }
    }
    const byId=id=>g.entities.find(e=>e.id===id),origOf=id=>down.orig.find(e=>e.id===id);
    if(down.kind==='vertex'){
      const sn=snap(p,ev,{skipKey:down.key,align:false});s.snap=sn;scene3d.snapLabel(sn.label,ev.clientX,ev.clientY);
      down.refs.forEach(([id,w])=>{const e=byId(id),o=origOf(id);if(e&&o)setRef(e,o,w,sn.p);});
    }else if(down.kind==='radius'){
      const e=byId(down.id);if(e)e.r=r3(Math.max(.01,dist2(e.c,p)));
    }else if(down.kind==='entity'){
      const dx=p[0]-down.start[0],dy=p[1]-down.start[1];
      down.ids.forEach(id=>{const o=origOf(id),e=byId(id);if(o&&e)Object.assign(e,shifted(o,dx,dy));});
      down.attached.forEach(([id,w])=>{const e=byId(id),o=origOf(id);if(!e||!o)return;
        if(w==='a0'||w==='a1'){const q=segEnds(o)[w==='a0'?0:1];setRef(e,o,w,[q[0]+dx,q[1]+dy]);}
        else{const q=o[w];e[w]=[r3(q[0]+dx),r3(q[1]+dy)];}});
    }
    scene3d.overlay();
  }
  function onUp(ev,moved){
    const s=S();const d=down;down=null;
    if(s.tool){if(!moved||true){const p=uvOf(ev);if(p){const sn=snap(p,ev,{align:!['circle','polygon','point','fillet','chamfer'].includes(s.tool)&&!(s.tool==='arc'&&s.step!==1),from:s.tool==='arc'&&s.step===1?s.pts[0]:undefined});click(sn.p,ev);}}return;}
    if(!d)return;
    if(d.kind==='box'&&moved&&s.box){
      const [a,b]=[s.box.a,s.box.b],x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);
      if(!d.add)s.sel.clear();
      (sk().entities||[]).forEach(e=>{const pts=e.type==='circle'?[[e.c[0]-e.r,e.c[1]-e.r],[e.c[0]+e.r,e.c[1]+e.r]]:e.type==='arc'?segSample(e,true).concat([segEnds(e)[1]]):entVertices(e);if(pts.every(q=>q[0]>=x0&&q[0]<=x1&&q[1]>=y0&&q[1]<=y1))s.sel.add(e.id);});

    }
    if(d.began){s.snap=null;scene3d.snapLabel(null);refreshSketch(true);return;}
    if(d.kind==='entity'||d.kind==='radius'){if(d.add&&s.sel.has(d.id))s.sel.delete(d.id);else s.sel.add(d.id);afterSel();return;}
    if(d.kind==='vertex'){afterSel();return;}
    if(!d.add)s.sel.clear();s.box=null;afterSel();
  }
  function afterSel(){scene3d.overlay();renderPanel();}
  function onRight(){
    const s=S();
    if(s.tool==='polyline'&&s.step>0){reset(true);renderPanel();scene3d.overlay();return;}
    if(s.tool&&s.step>0){reset(true);renderPanel();scene3d.overlay();return;}
    if(s.tool){stop();return;}
  }
  function escape(){
    const s=S();
    if(s.tool&&s.step>0){reset(true);renderPanel();scene3d.overlay();return true;}
    if(s.tool){stop();return true;}
    if(s.sel.size){s.sel.clear();afterSel();return true;}
    return false;
  }
  function enter(){const s=S();if(s.tool==='polyline'&&s.step>0){reset(true);renderPanel();scene3d.overlay();return true;}return false;}
  /* поля панели параметров */
  function live(){
    const s=S(),c=s.cursor,v={};
    if(c){v.x=c[0];v.y=c[1];}
    const last=s.pts[s.pts.length-1];
    if(s.step>0&&c){
      if(['line','polyline','cline'].includes(s.tool)){const q=lineEnd(last,c);v.len=dist2(last,q);v.ang=angDeg(Math.atan2(q[1]-last[1],q[0]-last[0]));}
      if(s.tool==='rect'){const r=rectCorners(s.pts[0],c);if(r){v.w=dist2(r[0],r[1]);v.h=dist2(r[1],r[2]);}}
      if(s.tool==='circle'||s.tool==='polygon'||(s.tool==='arc'&&s.step===1)){v.r=s.lock.r!=null?s.lock.r:dist2(s.pts[0],c);}
      if(s.tool==='arc'&&s.step===2){v.r=dist2(s.pts[0],s.pts[1]);v.sw=Math.abs(s.sweep)*180/Math.PI;}
      if(s.tool==='move'){v.dx=c[0]-s.pts[0][0];v.dy=c[1]-s.pts[0][1];}
    }
    return v;
  }
  function fields(){
    const s=S(),t=s.tool,st=s.step,f=[];
    const pointLabel={line:['т1','т2'],cline:['т1','т2'],polyline:['т1','т'],rect:['Вершина 1','Вершина 2'],circle:['Центр','Точка'],arc:['Центр','Начало','Конец'],polygon:['Центр','Вершина'],point:['Точка'],move:['База','Новое положение'],fillet:[],chamfer:[]}[t]||[];
    if(pointLabel.length)f.push({k:'xy',label:pointLabel[Math.min(st,pointLabel.length-1)]});
    if(st>0&&['line','polyline','cline'].includes(t)){f.push({k:'len',label:'Длина',lock:true});f.push({k:'ang',label:'Угол',lock:true,unit:'°'});}
    if(st>0&&t==='rect'){f.push({k:'w',label:'Ширина',lock:true});f.push({k:'h',label:'Высота',lock:true});}
    if(st>0&&(t==='circle'||t==='polygon'||(t==='arc'&&st===1)))f.push({k:'r',label:t==='polygon'?'Радиус':'Радиус',lock:true});
    if(t==='arc'&&st===2)f.push({k:'sw',label:'Угол дуги',unit:'°',ro:true});
    if(t==='polygon')f.push({k:'sides',label:'Количество вершин',opt:true});
    if(t==='fillet')f.push({k:'filletR',label:'Радиус',opt:true});
    if(t==='chamfer')f.push({k:'chamferD',label:'Длина',opt:true});
    if(t==='move'&&st>0){f.push({k:'dx',label:'Сдвиг по X',ro:true});f.push({k:'dy',label:'Сдвиг по Y',ro:true});}
    return f;
  }
  return {start,stop,escape,enter,del,preview,live,fields,click,reset,
    down:onDown,move:onMove,up:onUp,right:onRight,leave(){scene3d.snapLabel(null);},cancelPointer(){down=null;},
    selectAll(){const g=sk();if(!g)return;(g.entities||[]).forEach(e=>S().sel.add(e.id));afterSel();},
    applyEnter(k){
      const s=S();if(!s.tool)return;
      if(k==='x'||k==='y'){const c=s.cursor||[0,0];const p=[s.typed.x!=null?s.typed.x:c[0],s.typed.y!=null?s.typed.y:c[1]];s.typed={};s.cursor=p;click(p);return;}
      if(s.step>0&&s.cursor)click(s.cursor);else if(s.step>0){const last=s.pts[s.pts.length-1];click(last);}
    }
  };
})();
function updateSketchFields(){
  if(state.mode!=='sketch'||!state.sk.tool)return;
  const v=sketcher.live(),s=state.sk;
  panelEl.querySelectorAll('[data-skf]').forEach(inp=>{
    const k=inp.dataset.skf;if(document.activeElement===inp)return;
    if(s.lock[k]!=null){inp.value=fmt(s.lock[k]);return;}
    if(k in s.opts){inp.value=s.opts[k];return;}
    if(v[k]!=null)inp.value=fmt(v[k]);else if(k==='x'||k==='y')inp.value='';
  });
}
const fmt=x=>(Math.round(x*1000)/1000).toString().replace('.',',');
function sketchToolHTML(){
  const s=state.sk,t=s.tool,title=TOOL_TITLE[t],msgs=TOOL_MSG[t]||[''];
  const msg=t==='move'&&!s.sel.size?'Выделите объекты эскиза перед сдвигом':msgs[Math.min(s.step,msgs.length-1)];
  const rows=sketcher.fields().map(f=>{
    if(f.k==='xy')return `<div class="pp-row"><div class="pp-label">${esc(f.label)}</div><div class="xy-pair"><label>x<input class="pp-field" id="skf-x" data-skf="x" inputmode="decimal" aria-label="${esc(f.label)}: x"></label><label>y<input class="pp-field" id="skf-y" data-skf="y" inputmode="decimal" aria-label="${esc(f.label)}: y"></label></div><span></span></div>`;
    const locked=s.lock[f.k]!=null;
    return `<div class="pp-row${locked?' hl':''}"><label class="pp-label" for="skf-${f.k}">${esc(f.label)}</label><input class="pp-field" id="skf-${f.k}" data-skf="${f.k}" inputmode="decimal" ${f.ro?'readonly':''} aria-label="${esc(f.label)}${f.unit?', '+f.unit:', мм'}">${locked?`<button type="button" class="pp-side" data-unlock="${f.k}" data-tip="Снять фиксацию значения" aria-label="Снять фиксацию">${svg('cross',12)}</button>`:'<span></span>'}</div>`;
  }).join('');
  const rectMode=t==='rect'?`<div class="pp-row"><div class="pp-label">Способ:<small>${s.opts.rect==='center'?'По центру и вершине':'По двум вершинам'}</small></div><div class="pp-iconset"><button type="button" data-rmode="corners" aria-pressed="${s.opts.rect!=='center'}" title="По двум вершинам" aria-label="По двум вершинам">${svg('rectangle',17)}</button><button type="button" data-rmode="center" aria-pressed="${s.opts.rect==='center'}" title="По центру и вершине" aria-label="По центру и вершине">${svg('concentric',17)}</button></div><span></span></div>`:'';
  return `<div class="panel-head"><span>Параметры</span><button type="button" data-toast="Настройки панели в прототип не входят" aria-label="Настройки панели">${svg('gear',14)}</button></div>
  <div class="pp-cmd"><strong>${esc(title)}</strong><button type="button" data-toast="Справка в прототип не входит" aria-label="Справка">${svg('helpq',16)}</button><button type="button" data-tab-go="tree" aria-label="Показать дерево">${svg('tree',16)}</button></div>
  <div class="pp-tabs"><button type="button" class="tab" aria-selected="true">${svg(({line:'line',polyline:'autoline',rect:'rectangle',circle:'circle',arc:'arc',cline:'auxline',point:'point3',polygon:'contour',fillet:'sfillet',chamfer:'schamfer',move:'move'})[t],17)}</button><span class="spacer"></span>
   ${t==='polyline'?`<button type="button" class="pp-ok" data-skok ${s.step>0?'':'disabled'} data-tip="Закончить автолинию (Enter)" aria-label="Закончить автолинию">${svg('check',20)}</button>`:''}<button type="button" class="pp-cancel" data-skcancel data-tip="Прервать команду (Esc)" aria-label="Прервать команду">${svg('cross',18)}</button></div>
  <div class="pp-body">${rectMode}${rows}<p class="sk-hint">Введённое значение фиксируется (строка подсвечивается); Enter в поле координат ставит точку. Shift — только горизонталь/вертикаль, Alt — без привязок.</p></div>
  ${msgHTML(msg)}`;
}

new MutationObserver(()=>{renderTabs();scene3d.recolor();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{renderTabs();scene3d.recolor();});
refresh();
})();
