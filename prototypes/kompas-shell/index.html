<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип оболочки ASA-CAD</title>
<style>
/* Тёмная тема — основная (снята с КОМПАС-3D пользователя), светлая — переопределение токенов */
:root{
  color-scheme: dark;
  --frame:#000000; --menubar:#333333; --menubar-hover:#4c4c4c; --tabs:#4c4c4c; --tab-active:#000000; --tab-active-text:#f2f2f2;
  --instr:#484848; --instr-label:#333333; --instr-sep:#000000; --btn-hover:#5f5f5f; --btn-press:#000000; --toolset-active:#000000;
  --text:#f0f0f0; --text-muted:#bdbdbd; --text-dim:#8e8e8e; --icon:#f0f0f0;
  --rail:#333333; --rail-active:#000000; --panel:#484848; --panel-head:#333333; --field:#666666; --field-border:#2b2b2b; --field-text:#f6f6f6;
  --tree-gutter:#333333; --tree-line:#3b3b3b; --tree-sel:#666666;
  --row-hl:#3a9eb4; --select-line:#33cce5; --link:#57b8ff; --msg:#3a3a3a; --section:#333333;
  --toggle-knob:#dedede; --toggle-track:#666666;
  --vp-top:#4b4b4c; --vp-bottom:#3a3a3a; --qa:#484848; --qa-active:#b2b2b2; --qa-active-icon:#111111;
  --ok:#3fcf5c; --cancel:#ff4b4b; --sketch-accent:#5ed08b;
  --plane-xy:#3d8fdc; --plane-zx:#8fd13f; --plane-zy:#e58c8c; --sketch-geom:#d650d6; --body:#a3adb8; --body-edge:#1c1c1c;
  --phantom:#caa58c; --phantom-edge:#e6e6e6; --profile:#ffd400; --hover3d:#8ad9ff; --sel3d:#33e5ff; --manip:#2f8cff;
  --st-impl:#4cc36a; --st-plan:#e3a21a; --st-def:#9a9a9a; --st-none:#ef6464;
  --toast-bg:#1b1b1b; --toast-text:#f2f2f2; --menu-pop:#3d3d3d; --shadow:rgba(0,0,0,.45); --scroll:#6a6a6a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --frame:#a8a8a8; --menubar:#f0f0f0; --menubar-hover:#dadada; --tabs:#d6d6d6; --tab-active:#ffffff; --tab-active-text:#1c1c1c;
    --instr:#f5f5f5; --instr-label:#e3e3e3; --instr-sep:#c6c6c6; --btn-hover:#dce9f5; --btn-press:#c3daf0; --toolset-active:#cde1f3;
    --text:#1e1e1e; --text-muted:#505050; --text-dim:#8a8a8a; --icon:#2b2b2b;
    --rail:#e6e6e6; --rail-active:#ffffff; --panel:#f5f5f5; --panel-head:#e3e3e3; --field:#ffffff; --field-border:#b5b5b5; --field-text:#1c1c1c;
    --tree-gutter:#ebebeb; --tree-line:#e2e2e2; --tree-sel:#cde1f3;
    --row-hl:#3a9eb4; --select-line:#15a6c7; --link:#0b6fd1; --msg:#ebebeb; --section:#e3e3e3;
    --toggle-knob:#ffffff; --toggle-track:#b5b5b5;
    --vp-top:#fbfbfc; --vp-bottom:#c8cdd5; --qa:#f0f0f0; --qa-active:#9fc5e8; --qa-active-icon:#0f2a44;
    --ok:#1f9e3c; --cancel:#e02e2e; --sketch-accent:#2fae62;
    --plane-xy:#2a77c9; --plane-zx:#5fa61f; --plane-zy:#d05a5a; --sketch-geom:#b01aa6; --body:#b7c0ca; --body-edge:#2a2a2a;
    --phantom:#b3825f; --phantom-edge:#555555; --profile:#d4a100; --hover3d:#3a9ee6; --sel3d:#00a3d6; --manip:#1f6fe0;
    --st-impl:#23a046; --st-plan:#c98a00; --st-def:#8d8d8d; --st-none:#d93b3b;
    --toast-bg:#2b2b2b; --toast-text:#f5f5f5; --menu-pop:#ffffff; --shadow:rgba(0,0,0,.18); --scroll:#b9b9b9;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --frame:#a8a8a8; --menubar:#f0f0f0; --menubar-hover:#dadada; --tabs:#d6d6d6; --tab-active:#ffffff; --tab-active-text:#1c1c1c;
  --instr:#f5f5f5; --instr-label:#e3e3e3; --instr-sep:#c6c6c6; --btn-hover:#dce9f5; --btn-press:#c3daf0; --toolset-active:#cde1f3;
  --text:#1e1e1e; --text-muted:#505050; --text-dim:#8a8a8a; --icon:#2b2b2b;
  --rail:#e6e6e6; --rail-active:#ffffff; --panel:#f5f5f5; --panel-head:#e3e3e3; --field:#ffffff; --field-border:#b5b5b5; --field-text:#1c1c1c;
  --tree-gutter:#ebebeb; --tree-line:#e2e2e2; --tree-sel:#cde1f3;
  --row-hl:#3a9eb4; --select-line:#15a6c7; --link:#0b6fd1; --msg:#ebebeb; --section:#e3e3e3;
  --toggle-knob:#ffffff; --toggle-track:#b5b5b5;
  --vp-top:#fbfbfc; --vp-bottom:#c8cdd5; --qa:#f0f0f0; --qa-active:#9fc5e8; --qa-active-icon:#0f2a44;
  --ok:#1f9e3c; --cancel:#e02e2e; --sketch-accent:#2fae62;
  --plane-xy:#2a77c9; --plane-zx:#5fa61f; --plane-zy:#d05a5a; --sketch-geom:#b01aa6; --body:#b7c0ca; --body-edge:#2a2a2a;
  --phantom:#b3825f; --phantom-edge:#555555; --profile:#d4a100; --hover3d:#3a9ee6; --sel3d:#00a3d6; --manip:#1f6fe0;
  --st-impl:#23a046; --st-plan:#c98a00; --st-def:#8d8d8d; --st-none:#d93b3b;
  --toast-bg:#2b2b2b; --toast-text:#f5f5f5; --menu-pop:#ffffff; --shadow:rgba(0,0,0,.18); --scroll:#b9b9b9;
}
:root[data-theme="dark"]{ color-scheme: dark; }

/* Эталонная сетка KOMPAS v25 @1920×1080, 100 %: меню 28, вкладки 27, инструментальная область 93, рейка 26, панель 310 */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:12px/1.25 "Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--select-line);outline-offset:-2px}
*{box-sizing:border-box}
.ic{display:block;flex:none;color:var(--icon)}
.ic-xy{color:var(--plane-xy)} .ic-zx{color:var(--plane-zx)} .ic-zy{color:var(--plane-zy)}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px} ::-webkit-scrollbar-track{background:transparent}

.app{height:100%;display:grid;grid-template-rows:28px 27px 93px minmax(0,1fr);padding:0 3px 3px;background:var(--frame);min-width:0;position:relative}

/* ── строка меню ── */
.main-menu-bar{display:flex;align-items:center;gap:6px;background:var(--menubar);border-top:5px solid var(--frame);min-width:0;padding-right:6px}
.app-mark{width:20px;height:19px;margin-left:3px;display:grid;place-items:center;flex:none}
.app-mark svg{width:19px;height:19px}
.main-menu-items{display:flex;align-items:stretch;height:22px;min-width:0;overflow-x:auto;scrollbar-width:none;position:relative}
.main-menu-items::-webkit-scrollbar{display:none}
.menu-item{padding:0 6px;height:22px;white-space:nowrap;font-size:12px;border-radius:0}
.menu-item:hover,.menu-item[aria-expanded="true"]{background:var(--menubar-hover)}
.title-tools{display:flex;margin-left:auto;gap:0}
.title-tools button{width:26px;height:22px;display:grid;place-items:center}
.title-tools button:hover{background:var(--menubar-hover)}
.command-search{position:relative;width:166px;height:22px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--field);border:1px solid var(--field-border)}
.command-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:12px;color:var(--field-text)}
.command-search input::placeholder{color:var(--text-dim)}
.search-results{position:absolute;right:-1px;top:23px;width:300px;max-width:calc(100vw - 16px);background:var(--menu-pop);border:1px solid var(--frame);box-shadow:0 8px 20px var(--shadow);z-index:60;padding:3px}
.search-results button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;text-align:left}
.search-results button:hover,.search-results button:focus-visible{background:var(--btn-hover)}
.search-results small{margin-left:auto;color:var(--text-dim);white-space:nowrap}
.search-empty{padding:8px;color:var(--text-dim)}
.menu-pop{position:fixed;z-index:70;min-width:210px;background:var(--menu-pop);border:1px solid var(--frame);box-shadow:0 8px 20px var(--shadow);padding:3px 0}
.menu-pop button{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0 12px 0 8px;text-align:left;white-space:nowrap;position:relative}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--btn-hover)}
.menu-pop hr{border:0;border-top:1px solid var(--instr-sep);margin:3px 0}

/* ── вкладки документов ── */
.document-tabs{display:flex;align-items:end;gap:2px;background:var(--tabs);border-top:1px solid var(--frame);border-bottom:1px solid var(--frame);padding:0 0 0 1px;min-width:0}
.home-btn,.home-caret{height:24px;display:grid;place-items:center}
.home-btn{width:26px}.home-caret{width:16px;margin-right:6px}
.home-btn:hover,.home-caret:hover{background:var(--btn-hover)}
.doc-tab{height:24px;min-width:0;max-width:260px;display:flex;align-items:center;gap:6px;padding:0 6px 0 7px;background:var(--tab-active);color:var(--tab-active-text);font-size:12.5px;white-space:nowrap}
.doc-tab .ic{color:var(--tab-active-text)}
.doc-tab span{overflow:hidden;text-overflow:ellipsis}
.doc-tab .tab-x{width:18px;height:18px;display:grid;place-items:center;margin-left:6px}
.app[data-mode="sketch"] .document-tabs{border-bottom:3px solid var(--sketch-accent)}
.app[data-mode="sketch"] .doc-tab{box-shadow:inset 0 -2px 0 var(--sketch-accent)}
.proto-tools{margin-left:auto;display:flex;align-items:center;gap:4px;height:26px;padding:0 4px}
.chip{height:20px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--text-dim);border-radius:10px;font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--text-muted)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--st-impl)}
.chip .dots{display:flex;gap:2px}.chip .dots i{width:6px;height:6px;border-radius:50%;display:block}
.icon-btn{width:24px;height:22px;display:grid;place-items:center;border-radius:2px}
.icon-btn:hover{background:var(--btn-hover)}

/* ── инструментальная область ── */
.instrument-area{display:flex;background:var(--instr);min-width:0;overflow:hidden}
.toolsets{width:120px;flex:none;display:grid;grid-template-rows:25px 25px 25px 18px;border-right:1px solid var(--instr-sep)}
.toolset{display:flex;align-items:center;gap:5px;padding:0 3px;text-align:left;font-size:11.5px;line-height:11px;height:25px}
.toolset span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toolset:hover{background:var(--btn-hover)}
.toolset[aria-pressed="true"]{background:var(--toolset-active)}
.toolset-more{display:grid;place-items:center;background:var(--instr-label);color:var(--text-muted)}
.toolset-more:hover{color:var(--text)}
.command-ribbon{flex:1;display:flex;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.cmd-panel{flex:none;display:grid;grid-template-rows:75px 18px;border-right:1px solid var(--instr-sep);min-width:0}
.cmd-panel-body{display:flex;gap:1px;padding:0 1px}
.cmd-col{display:flex;flex-direction:column}
.cmd-panel-label{display:flex;align-items:center;gap:3px;background:var(--instr-label);color:var(--text-muted);font-size:11px;padding:0 3px 0 6px;min-width:0;width:0;min-width:100%}
.cmd-panel-label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.cmd-panel-label .caret{width:9px;height:9px;flex:none}
.grip{width:4px;height:11px;flex:none;background-image:radial-gradient(circle,var(--text-dim) 1px,transparent 1.3px);background-size:4px 4px;opacity:.85}
.btn-t,.btn-i{position:relative;height:25px;display:flex;align-items:center;border-radius:1px}
.btn-t{width:120px;gap:4px;padding:0 3px;text-align:left;font-size:11.5px;line-height:11px}
.btn-t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-i{width:26px;justify-content:center}
.btn-t:hover,.btn-i:hover{background:var(--btn-hover)}
.btn-t.on,.btn-i.on,.btn-t:active,.btn-i:active{background:var(--btn-press)}
.btn-t.on span{color:var(--tab-active-text)}
.btn-t.dim,.btn-i.dim{opacity:.45}

/* статусы команд ASA-CAD (реестр spec/ui/command-registry.v1.json) */
.show-status [data-st]::after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--dot,transparent);box-shadow:0 0 0 1px var(--instr)}
.show-status [data-st="implemented"]{--dot:var(--st-impl)}
.show-status [data-st="planned"]{--dot:var(--st-plan)}
.show-status [data-st="deferred"]{--dot:var(--st-def)}
.show-status [data-st="none"]::after{background:transparent;border:1.5px solid var(--st-none);width:6px;height:6px}

/* ── основная область ── */
.content{display:grid;grid-template-columns:26px 310px 1px minmax(0,1fr);min-height:0;border-top:1px solid var(--frame);position:relative}
.content.collapsed{grid-template-columns:26px 0 0 minmax(0,1fr)}
.content.collapsed .management-panel{display:none}
.management-rail{background:var(--rail);display:flex;flex-direction:column;border-right:1px solid var(--frame)}
.rail-tab{width:26px;height:25px;display:grid;place-items:center}
.rail-tab:hover{background:var(--btn-hover)}
.rail-tab[aria-selected="true"]{background:var(--rail-active)}
.management-panel{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.splitter{background:var(--frame)}
.panel-head{height:20px;flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--panel-head);padding:0 3px 0 4px;font-size:12px}
.panel-head button{width:20px;height:18px;display:grid;place-items:center}
.tree-toolbar{height:30px;flex:none;display:flex;align-items:center;gap:0;padding:0 2px}
.tree-toolbar button{width:30px;height:26px;display:grid;place-items:center}
.tree-toolbar button:hover{background:var(--btn-hover)}
.tree-search{height:25px;flex:none;display:flex;gap:2px;margin:0 0 3px}
.tree-search button{width:26px;display:grid;place-items:center}
.tree-search label{flex:1;display:flex;align-items:center;gap:5px;background:var(--field);padding:0 6px;min-width:0}
.tree-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--field-text)}
.tree-search input::placeholder{color:var(--text-muted)}
.tree-rows{flex:1;min-height:0;overflow:auto}
.tree-row{display:grid;grid-template-columns:32px 36px minmax(0,1fr);height:26px;border-bottom:1px solid var(--tree-line);cursor:default}
.tree-row .c-eye,.tree-row .c-aux{background:var(--tree-gutter);display:grid;place-items:center;color:var(--text-muted);font-size:14px}
.tree-row .c-main{display:flex;align-items:center;gap:4px;min-width:0;padding-right:6px}
.tree-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tree-row:hover .c-main{background:color-mix(in srgb,var(--tree-sel) 45%,transparent)}
.tree-row.sel .c-main{background:var(--tree-sel)}
.tree-row.hidden-obj .lbl{color:var(--text-dim)}
.eye-btn{width:26px;height:22px;display:grid;place-items:center}
.eye-btn .ic{color:var(--text-muted)}
.tri{width:14px;height:20px;display:grid;place-items:center;flex:none}
.tri svg{width:9px;height:9px;transition:transform .12s}
.tri[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tri-sp{width:14px;flex:none}
.odot{font-size:9px;color:var(--text);margin:0 1px}
.tree-end{height:3px;background:var(--select-line)}
.tree-lower{height:172px;flex:none;display:flex;flex-direction:column;border-top:4px solid var(--frame)}
.lower-tabs{height:30px;display:flex;align-items:stretch;border-bottom:2px solid var(--frame)}
.lower-tabs button{width:36px;display:grid;place-items:center}
.lower-tabs button[aria-selected="true"]{background:var(--rail-active)}
.muted-note{padding:14px 12px;color:var(--text-dim);font-size:12px}

/* панель параметров */
.pp-cmd{height:26px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 4px;font-size:11.5px}
.pp-cmd strong{font-weight:400;flex:1}
.pp-cmd button{width:26px;height:22px;display:grid;place-items:center}
.pp-tabs{height:34px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:2px solid var(--frame)}
.pp-tabs .tab{width:30px;height:28px;display:grid;place-items:center}
.pp-tabs .tab[aria-selected="true"]{background:var(--rail-active)}
.pp-tabs .spacer{flex:1}
.pp-ok,.pp-cancel{width:30px;height:28px;display:grid;place-items:center}
.pp-ok .ic{color:var(--ok)} .pp-cancel .ic{color:var(--cancel)}
.pp-ok:disabled{opacity:.35;cursor:default}
.pp-ok:hover:not(:disabled),.pp-cancel:hover{background:var(--btn-hover)}
.pp-body{flex:1;min-height:0;overflow:auto;padding:6px 0 10px}
.pp-row{display:grid;grid-template-columns:116px minmax(0,1fr) 30px;align-items:center;column-gap:4px;min-height:30px;padding:2px 0}
.pp-label{text-align:right;font-size:12px;line-height:1.15;color:var(--text)}
.pp-label small{display:block;color:var(--text-dim);font-size:11.5px}
.pp-label a,.pp-link{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.pp-iconset{display:flex;gap:4px}
.pp-iconset button{width:28px;height:26px;display:grid;place-items:center}
.pp-iconset button:hover{background:var(--btn-hover)}
.pp-iconset button[aria-pressed="true"]{background:var(--rail-active)}
.pp-field{height:24px;width:100%;background:var(--field);border:1px solid var(--field-border);color:var(--field-text);padding:0 6px;outline:0;min-width:0}
.pp-field.invalid{border-color:var(--cancel);box-shadow:0 0 0 1px var(--cancel)}
.pp-fieldwrap{display:flex;align-items:center;background:var(--field);border:1px solid var(--field-border);height:24px;min-width:0}
.pp-fieldwrap .v{flex:1;padding:0 6px;color:var(--field-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-fieldwrap .v.ph{color:var(--text-muted);font-style:italic}
.pp-fieldwrap button{width:22px;height:22px;display:grid;place-items:center}
.pp-side{width:28px;height:26px;display:grid;place-items:center}
.pp-side:hover{background:var(--btn-hover)}
.pp-list{height:102px;background:var(--field);border:1px solid var(--field-border);padding:4px 6px;color:var(--field-text);overflow:auto}
.pp-list div{height:24px;display:flex;align-items:center}
.pp-select{outline:1px dashed var(--select-line);outline-offset:-1px;margin:2px 0}
.pp-row.hl{background:var(--row-hl)}
.pp-row.hl .pp-label{color:#fff}
.pp-row.hl .pp-side .ic{color:#fff}
.pp-lbl-drop{display:inline-flex;align-items:center;gap:4px}
.pp-lbl-drop svg{width:9px;height:9px}
.toggle{width:64px;height:22px;display:flex;border:1px solid var(--field-border);background:var(--toggle-track);padding:0}
.toggle i{flex:1;display:block}
.toggle .knob{background:var(--toggle-knob)}
.toggle .ring{display:grid;place-items:center}
.toggle .ring::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--toggle-knob)}
.toggle[aria-checked="true"] .knob{background:var(--row-hl)}
.toggle[aria-checked="true"]{flex-direction:row-reverse}
.pp-section{margin-top:10px}
.pp-section>button{width:100%;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--section);font-size:12.5px}
.pp-section>button svg{width:10px;height:10px;transition:transform .12s}
.pp-section>button[aria-expanded="false"] svg{transform:rotate(-90deg)}
.pp-section .inner{padding:6px 0 2px}
.pp-msg{flex:none;display:grid;grid-template-columns:22px 1fr 18px;gap:4px;align-items:start;background:var(--msg);padding:8px 6px 9px;font-size:12.5px;line-height:1.35;border-top:1px solid var(--frame)}
.pp-msg button{width:18px;height:18px;display:grid;place-items:center}
.var-table{width:100%;border-collapse:collapse;font-size:12px}
.var-table th{font-weight:400;text-align:left;color:var(--text-muted);background:var(--tree-gutter);padding:4px 6px;border-bottom:1px solid var(--frame)}
.var-table td{padding:4px 6px;border-bottom:1px solid var(--tree-line)}

/* ── графическая область ── */
.work-area{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(var(--vp-top),var(--vp-bottom))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.qa{position:absolute;top:0;left:16px;display:flex;height:25px;background:var(--qa);border:1px solid var(--frame);border-top:0;z-index:5;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa .qgrip{width:10px;flex:none;background-image:radial-gradient(circle,var(--text-dim) 1px,transparent 1.3px);background-size:4px 4px;background-position:3px 5px;background-repeat:repeat;margin:4px 0}
.qa-b{height:24px;width:26px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px}
.qa-b.drop{width:47px}.qa-b.drop46{width:46px}
.qa-b .caret{width:8px;height:8px}
.qa-b:hover{background:var(--btn-hover)}
.qa-b.on{background:var(--qa-active)} .qa-b.on .ic{color:var(--qa-active-icon)}
.qa-b.sk-on .ic{color:var(--sketch-accent)}
.qa-sep{width:1px;flex:none;background:var(--frame)}
.qa-ok .ic{color:var(--ok)} .qa-cancel .ic{color:var(--cancel)}
.sketch-exit{position:absolute;top:32px;right:16px;width:46px;height:46px;display:grid;place-items:center;background:var(--rail-active);border:1px solid var(--frame);z-index:5}
.sketch-exit .ic{color:var(--sketch-accent)}
.sketch-exit:hover{outline:2px solid var(--sketch-accent);outline-offset:-2px}
.triad{position:absolute;left:4px;bottom:4px;width:96px;height:96px;pointer-events:none}
.legend{position:absolute;right:16px;bottom:16px;width:270px;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--frame);box-shadow:0 8px 24px var(--shadow);padding:10px 12px 11px;z-index:6;font-size:12px}
.legend h3{margin:0 0 6px;font-size:12.5px;font-weight:600}
.legend .lrow{display:flex;align-items:center;gap:8px;height:21px}
.legend .lrow b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.legend .sw{width:9px;height:9px;border-radius:50%;flex:none}
.legend .sw.none{border:1.5px solid var(--st-none)}
.legend p{margin:8px 0 0;color:var(--text-dim);font-size:11.5px;line-height:1.4}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,8px);background:var(--toast-bg);color:var(--toast-text);padding:8px 14px;border-radius:3px;font-size:12.5px;max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:8;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gl-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted);padding:24px;text-align:center}
.qa-menu{position:absolute;z-index:9;min-width:170px;background:var(--menu-pop);border:1px solid var(--frame);box-shadow:0 8px 20px var(--shadow);padding:3px 0}
.qa-menu button{display:flex;width:100%;height:26px;align-items:center;padding:0 12px;white-space:nowrap}
.qa-menu button:hover{background:var(--btn-hover)}

@media (max-width: 760px){
  .title-tools{display:none}
  .command-search{width:128px}
  .proto-tools .chip span.t{display:none}
  .content,.content.collapsed{grid-template-columns:26px 0 0 minmax(0,1fr)}
  .management-panel{position:absolute;left:26px;top:0;bottom:0;width:min(310px,calc(100% - 42px));z-index:20;box-shadow:6px 0 18px var(--shadow)}
  .content.collapsed .management-panel{display:none}
  .splitter{display:none}
  .legend{width:230px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

</head>
<body>
<div class="app" id="app" data-mode="idle">
  <header class="main-menu-bar">
    <div class="app-mark" title="ASA-CAD">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="3" fill="#1f6fd1"/><path d="M7 18 12 5.5 17 18M8.9 13.5h6.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <nav class="main-menu-items" id="menu" aria-label="Главное меню"></nav>
    <div class="title-tools">
      <button type="button" data-toast="Раскладка окна в прототип не входит" title="Раскладка окна" aria-label="Раскладка окна" id="btnLayout"></button>
      <button type="button" data-toast="Настройки в прототип не входят" title="Настройки" aria-label="Настройки" id="btnSettings"></button>
    </div>
    <label class="command-search" id="searchWrap">
      <span id="searchIcon"></span>
      <input id="search" type="text" placeholder="Поиск по командам (Alt+/)" aria-label="Поиск по командам" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </label>
  </header>

  <div class="document-tabs" role="tablist" aria-label="Документы">
    <button type="button" class="home-btn" id="homeBtn" title="Начальная страница" aria-label="Начальная страница"></button>
    <button type="button" class="home-caret" id="homeCaret" title="Список документов" aria-label="Список документов"></button>
    <div class="doc-tab" role="tab" aria-selected="true" id="docTab"></div>
    <div class="proto-tools">
      <button type="button" class="chip" id="btnStatus" aria-pressed="false" title="Показать, какие команды уже есть в ASA-CAD">
        <span class="dots"><i style="background:var(--st-impl)"></i><i style="background:var(--st-plan)"></i><i style="background:var(--st-def)"></i></span><span class="t">Статус в ASA-CAD</span>
      </button>
      <button type="button" class="icon-btn" id="btnTheme" title="Светлая / тёмная тема" aria-label="Переключить тему"></button>
    </div>
  </div>

  <section class="instrument-area" aria-label="Инструментальная область">
    <div class="toolsets" id="toolsets" role="toolbar" aria-label="Наборы инструментов"></div>
    <div class="command-ribbon" id="ribbon" role="toolbar" aria-label="Панели набора"></div>
  </section>

  <main class="content" id="content">
    <nav class="management-rail" id="rail" role="tablist" aria-label="Панели управления"></nav>
    <aside class="management-panel" id="panel"></aside>
    <div class="splitter"></div>
    <div class="work-area" id="work">
      <canvas id="gl" aria-label="Графическая область"></canvas>
      <div class="qa" id="qa" role="toolbar" aria-label="Панель быстрого доступа"></div>
      <div class="qa-menu" id="qaMenu" hidden></div>
      <button type="button" class="sketch-exit" id="sketchExit" hidden title="Выйти из эскиза" aria-label="Выйти из эскиза"></button>
      <svg class="triad" id="triad" viewBox="-48 -48 96 96" aria-hidden="true"></svg>
      <div class="legend" id="legend" hidden></div>
      <div class="gl-fallback" id="glFallback" hidden>3D-вид не загрузился: библиотека Three.js недоступна. Остальная вёрстка работает.</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </main>
  <div class="menu-pop" id="menuPop" hidden></div>
</div>

    if(p.startsWith('F:'))return `<path d="${p.slice(2)}" fill="currentColor" stroke="none"/>`;

  }
  const skRow=(s,depth)=>({key:'sketch:'+s.id,depth,label:(s.geom?'(-)':'')+s.name,icon:'ts_sketch',aux:'∈',eye:s.visible,selected:isSel('sketch',s.id)||state.editSketch===s.id});

/* ───────── команды ───────── */
function snapshot(){history.push(JSON.stringify(doc));if(history.length>50)history.shift();future.length=0;}
function undo(){if(state.mode!=='idle'){toast('Сначала завершите или прервите команду');return;}if(!history.length){toast('Отменять нечего');return;}future.push(JSON.stringify(doc));doc=JSON.parse(history.pop());state.sel=null;refresh();toast('Действие отменено');}
function redo(){if(state.mode!=='idle'){toast('Сначала завершите или прервите команду');return;}if(!future.length){toast('Повторять нечего');return;}history.push(JSON.stringify(doc));doc=JSON.parse(future.pop());state.sel=null;refresh();toast('Действие повторено');}
function explain(id,label){toast(`«${label}» в прототипе не работает · ${ST_TEXT[status(id)]}`);}
function runCommand(id,label){
  closePopups();
  switch(id){
    case 'part.extrude':return startExtrude();
    case 'part.sketch.create':return sketchButton();
    case 'sketch.finish':return finishSketch();
    case 'system.undo':return undo();
    case 'system.redo':return redo();
    case 'view.fit':return scene3d.fit();
    case 'view.iso':return scene3d.view('iso');
  }
  if(state.mode!=='sketch'&&/^(sketch\.|constraint\.|dimension\.)/.test(id||'')&&id!=='sketch.finish'){
    toast(`«${label}» работает внутри эскиза: выберите плоскость и нажмите «Создать эскиз»`);return;
  }
  explain(id,label);
}
function selectedSketch(){const s=state.sel;return s&&s.type==='sketch'?sketchById(s.id):null;}
function startExtrude(){
  if(state.mode==='extrude')return;
  let sk=null;
  if(state.mode==='sketch'){sk=sketchById(state.editSketch);finishSketch(true);}
  sk=sk||selectedSketch()||doc.sketches.slice().reverse().find(s=>!s.used&&s.geom);
  if(!sk||sk.used){toast('Нет свободного эскиза с контуром. Выберите эскиз в дереве.');refresh();return;}
  if(!sk.geom){toast(`В «${sk.name}» нет замкнутого контура`);refresh();return;}
  state.cancelAwait=null;
  state.mode='extrude';
  state.op={sketchId:sk.id,distance:10,distanceText:'10',symmetric:false,reverse:false,second:false,thin:false,result:0,method:0,open:{thin:true,scope:false,props:false}};
  state.prevTab=state.panelTab==='params'?'tree':state.panelTab;state.panelTab='params';state.panelOpen=true;
  refresh();
}
function confirmExtrude(){
  const o=state.op;if(!o||!(o.distance>0))return;
  snapshot();
  doc.seq.extrude++;const n=doc.seq.extrude;
  doc.features.push({id:'f'+n,name:`Элемент выдавливания:${n}`,sketchId:o.sketchId,distance:o.distance,symmetric:o.symmetric,reverse:o.reverse,through:o.method===1,visible:true});
  const s=sketchById(o.sketchId);s.used=true;s.visible=false;
  state.mode='idle';state.op=null;state.panelTab=state.prevTab||'tree';state.sel={type:'feature',id:'f'+n};
  refresh();toast(`Создан «Элемент выдавливания:${n}»`);
}
function cancelCommand(){
  if(state.mode==='extrude'||state.mode==='awaitPlane'){state.mode='idle';state.op=null;state.panelTab=state.prevTab||'tree';refresh();}
}
function sketchButton(){
  if(state.mode==='sketch')return finishSketch();
  if(state.mode==='extrude')return;
  const s=state.sel;
  if(s&&s.type==='plane')return newSketchOn(s.id);
  if(s&&s.type==='sketch'){const sk=sketchById(s.id);if(sk&&!sk.used)return editSketch(sk.id);}
  state.mode='awaitPlane';state.prevTab=state.panelTab==='params'?'tree':state.panelTab;state.panelTab='params';state.panelOpen=true;
  if(!state.exp.origin)state.exp.origin=true;
  refresh();
}
function newSketchOn(plane){
  snapshot();doc.seq.sketch++;const n=doc.seq.sketch;
  doc.sketches.push({id:'s'+n,name:`Эскиз:${n}`,plane,geom:false,visible:true,used:false});
  state.mode='idle';state.panelTab=state.prevTab==='params'?'tree':(state.prevTab||'tree');
  editSketch('s'+n);
}
function editSketch(id){
  const sk=sketchById(id);
  state.mode='sketch';state.editSketch=id;state.sel={type:'sketch',id};
  if(state.toolset!=='sketch')state.prevToolset=state.toolset;
  state.toolset='sketch';if(state.panelTab==='params')state.panelTab='tree';
  scene3d.rememberView();scene3d.view(sk.plane);
  refresh();
}
function finishSketch(silent){
  if(state.mode!=='sketch')return;
  state.mode='idle';state.editSketch=null;state.toolset=state.prevToolset||'solid';
  scene3d.restoreView();
  if(!silent)refresh();
}
function selectKey(key){
  const [t,id]=key.split(':');
  if(state.mode==='awaitPlane'&&t==='plane'){newSketchOn(id);return;}
  if(t==='root'){state.sel=null;}
  else if(t==='origin')state.sel={type:'origin'};
  else state.sel={type:t,id};
  refresh();
}

/* ───────── события оболочки ───────── */

function openMenu(btn){
  const name=btn.dataset.menu;
  if(state.menu===name){closeMenu();return;}
  if(name!=='Файл'){closeMenu();toast(`Меню «${name}» в прототип не входит`);return;}
  state.menu=name;renderMenu();
  const r=btn.getBoundingClientRect();
  menuPop.style.left=r.left+'px';menuPop.style.top=(r.bottom)+'px';
  menuPop.innerHTML=FILE_MENU.map(it=>it?`<button type="button" data-cmd="${it[2]}" data-label="${it[0]}" data-st="${status(it[2])}">${svg(it[1],15)}${it[0]}</button>`:'<hr>').join('');
  menuPop.hidden=false;app.classList.toggle('show-status',state.status);
  const first=menuPop.querySelector('button');if(first)first.focus();
}
function closeMenu(){if(state.menu){state.menu=null;menuPop.hidden=true;renderMenu();}}
function closePopups(){closeMenu();qaMenu.hidden=true;searchRes.hidden=true;}
menuPop.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b){const id=b.dataset.cmd,l=b.dataset.label;closeMenu();runCommand(id,l);}});
ribbonEl.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)runCommand(b.dataset.cmd||null,b.dataset.label);});
ribbonEl.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&ribbonEl.scrollWidth>ribbonEl.clientWidth){ribbonEl.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
toolsetsEl.addEventListener('click',e=>{

    menuPop.hidden=false;state.menu='__more';return;
  }
  const b=e.target.closest('[data-toolset]');if(!b)return;

railEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  const t=b.dataset.tab;
  if(state.panelOpen&&state.panelTab===t)state.panelOpen=false;else{state.panelOpen=true;state.panelTab=t;}
  refresh();
});
panelEl.addEventListener('click',e=>{
  const go=e.target.closest('[data-tab-go]');if(go){state.panelTab=go.dataset.tabGo;refresh();return;}
  const eye=e.target.closest('[data-eye]');
  if(eye){toggleVis(eye.dataset.eye);return;}
  const tri=e.target.closest('[data-tri]');

/* ───────── 3D-вид (Three.js r128, параллельная проекция, Z вверх как у КОМПАСа) ───────── */
const scene3d=(function(){
  const noop={sync(){},fit(){},view(){},recolor(){},rememberView(){},restoreView(){}};
  if(!window.THREE){$('glFallback').hidden=false;return noop;}
  const TH=window.THREE,V3=TH.Vector3,DEG=Math.PI/180;
  const work=$('work'),canvas=$('gl'),triadEl=$('triad');
  let renderer;
  try{renderer=new TH.WebGLRenderer({canvas,antialias:true,alpha:true});}catch(err){$('glFallback').hidden=false;return noop;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new TH.Scene();
  const camera=new TH.OrthographicCamera(-1,1,1,-1,-2000,2000);
  scene.add(camera);
  scene.add(new TH.AmbientLight(0xffffff,.58));
  const key=new TH.DirectionalLight(0xffffff,.72);key.position.set(.4,.8,1);camera.add(key);
  const HALF=62;                      // половина высоты кадра в мм при zoom=1
  const cam={az:65*DEG,el:24*DEG,target:new V3(0,0,3),zoom:1};
  const VIEWS={iso:[65,24],front:[-90,0],back:[90,0],top:[-90,90],bottom:[-90,-90],left:[180,0],right:[0,0],xy:[-90,90],zx:[-90,0],zy:[0,0]};
  let saved=null,anim=null,needs=true,W=1,H=1;
  const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
  let col={};
  function readColors(){['--plane-xy','--plane-zx','--plane-zy','--sketch-geom','--body','--body-edge','--phantom','--phantom-edge','--profile','--hover3d','--sel3d','--manip'].forEach(k=>col[k]=new TH.Color(cssVar(k)));}
  readColors();

  function applyCam(){

  }
  function request(){if(!needs){needs=true;requestAnimationFrame(frame);}}
  function frame(){

  const planeDefs={xy:[[-P,-P,0],[P,-P,0],[P,P,0],[-P,P,0]],zx:[[-P,0,-P],[P,0,-P],[P,0,P],[-P,0,P]],zy:[[0,-P,-P],[0,P,-P],[0,P,P],[0,-P,P]]};

  function lineMat(c){return new TH.LineBasicMaterial({color:c});}
  function loop(pts,c){const g=new TH.BufferGeometry().setFromPoints(pts.map(p=>new V3(...p)));return new TH.LineLoop(g,lineMat(c));}
  function sketchShape(withHole=true){

  function isSel(t,id){const s=state.sel;return s&&s.type===t&&(id===undefined||s.id===id);}
  function isHover(t,id){const h=state.hover;return h&&h.type===t&&h.id===id;}
  function pickMesh(geom,info){const m=new TH.Mesh(geom,new TH.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,side:TH.DoubleSide}));m.userData.pick=info;pickables.push(m);return m;}

    // плоскости
    Object.entries(planeDefs).forEach(([k,pts])=>{
      if(!state.vis[k])return;
      const c=isSel('plane',k)?col['--sel3d']:isHover('plane',k)||(state.mode==='awaitPlane'&&isHover('plane',k))?col['--hover3d']:col['--plane-'+k];

    // эскизы
    doc.sketches.forEach(s=>{

      root.add(new TH.ArrowHelper(new V3(...ax[0]),new V3(0,0,0),14,col['--plane-zy'].getHex(),3.2,1.8));
      root.add(new TH.ArrowHelper(new V3(...ax[1]),new V3(0,0,0),14,col['--plane-zx'].getHex(),3.2,1.8));
    }
    // тела
    doc.features.forEach(f=>{
      if(!f.visible)return;
      const depth=f.through?60:f.distance;
      const geom=new TH.ExtrudeGeometry(sketchShape(true),{depth,bevelEnabled:false,curveSegments:56});
      const z0=f.symmetric?-depth/2:f.reverse?-depth:0;
      const mat=new TH.MeshStandardMaterial({color:col['--body'],roughness:.55,metalness:.05,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
      if(isSel('feature',f.id))mat.emissive=col['--sel3d'].clone().multiplyScalar(.35);else if(isHover('feature',f.id))mat.emissive=col['--hover3d'].clone().multiplyScalar(.18);

    });

    if(state.mode==='extrude'&&state.op){
      const o=state.op;const d=o.method===1?60:o.distance;
      if(d>0){
        const geom=new TH.ExtrudeGeometry(sketchShape(true),{depth:d,bevelEnabled:false,curveSegments:56});
        const z0=o.symmetric?-d/2:o.reverse?-d:0;
        const m=new TH.Mesh(geom,new TH.MeshBasicMaterial({color:col['--phantom'],transparent:true,opacity:.28,depthWrite:false,side:TH.DoubleSide}));m.position.z=z0;root.add(m);
        const e=new TH.LineSegments(new TH.EdgesGeometry(geom,25),new TH.LineBasicMaterial({color:col['--phantom-edge'],transparent:true,opacity:.75}));e.position.z=z0;root.add(e);
        const top=o.symmetric?d/2:o.reverse?-d:d;const dir=o.reverse&&!o.symmetric?-1:1;
        const cone=new TH.Mesh(new TH.ConeGeometry(1.8,4,16),new TH.MeshBasicMaterial({color:col['--manip']}));cone.rotation.x=dir>0?Math.PI/2:-Math.PI/2;cone.position.set(0,0,top+dir*3);root.add(cone);

  }
  /* выбор мышью */
  const ray=new TH.Raycaster(),ndc=new TH.Vector2();
  function pickAt(x,y){

    const pri={sketch:3,feature:2,plane:1};

    }
    if(e.pointerType==='mouse'&&!hoverRaf){hoverRaf=requestAnimationFrame(()=>{hoverRaf=0;const h=pickAt(e.clientX,e.clientY);
      const same=(h&&state.hover&&h.type===state.hover.type&&h.id===state.hover.id)||(!h&&!state.hover);
      if(!same){state.hover=h;canvas.style.cursor=h?'pointer':'default';sync();}});}
  });

      const h=pickAt(e.clientX,e.clientY);

      else if(state.mode==='idle'||state.mode==='sketch'){
        if(state.mode==='sketch'&&h&&h.type!=='sketch'){toast('В режиме эскиза выбор ограничен эскизом');}

  function basis(){const r=new V3(-Math.sin(cam.az),Math.cos(cam.az),0),ce=Math.cos(cam.el),d=new V3(ce*Math.cos(cam.az),ce*Math.sin(cam.az),Math.sin(cam.el));const u=new V3().crossVectors(r,d.clone().negate()).normalize();return {r,u};}

    const rect=canvas.getBoundingClientRect(),nx=((e.clientX-rect.left)/rect.width)*2-1,ny=-((e.clientY-rect.top)/rect.height)*2+1;
    const {r,u}=basis(),a=W/H,z0=cam.zoom,z1=Math.min(40,Math.max(.08,z0*Math.exp(-e.deltaY*.0015)));
    cam.target.addScaledVector(r,nx*HALF*a*(1/z0-1/z1)).addScaledVector(u,ny*HALF*(1/z0-1/z1));
    cam.zoom=z1;request();
  },{passive:false});
  /* триада осей в левом нижнем углу */
  function drawTriad(){
    const q=camera.quaternion.clone().invert();
    const axes=[['X',new V3(1,0,0),cssVar('--plane-zy')],['Y',new V3(0,1,0),cssVar('--plane-zx')],['Z',new V3(0,0,1),cssVar('--plane-xy')]].map(([n,v,c])=>{const s=v.clone().applyQuaternion(q);return {n,x:s.x*30,y:-s.y*30,z:s.z,c};}).sort((a,b)=>a.z-b.z);
    triadEl.innerHTML=axes.map(a=>{const len=Math.hypot(a.x,a.y);const lx=len>2?a.x*1.28:0,ly=len>2?a.y*1.28:0;return `<line x1="0" y1="0" x2="${a.x.toFixed(1)}" y2="${a.y.toFixed(1)}" stroke="${a.c}" stroke-width="3" stroke-linecap="round"/>${len>6?`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" fill="${a.c}" font-size="11" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif">${a.n}</text>`:''}`;}).join('')+'<circle r="5" fill="#d8c040" stroke="#5c5320" stroke-width="1"/>';
  }
  function bounds(){
    const b=new TH.Box3();let any=false;
    root.traverse(o=>{if(o.isLineLoop||o.isLine||o.isMesh){if(o.userData.pick&&o.material&&o.material.opacity===0&&o.userData.pick.type!=='feature')return;if(o.visible===false)return;b.expandByObject(o);any=true;}});
    return any?b:null;
  }
  return {
    sync,
    fit(){const b=bounds();if(!b){tween(cam.az,cam.el,1,new V3());return;}const sph=b.getBoundingSphere(new TH.Sphere());tween(cam.az,cam.el,Math.max(.1,Math.min(20,HALF/(sph.radius*1.12))),sph.center);},
    view(name){const v=VIEWS[name];if(!v)return;tween(v[0]*DEG,v[1]*DEG);},
    recolor(){readColors();sync();},
    rememberView(){saved={az:cam.az,el:cam.el,zoom:cam.zoom,target:cam.target.clone()};},
    restoreView(){if(saved){tween(saved.az,saved.el,saved.zoom,saved.target);saved=null;}}
  };
})();

new MutationObserver(()=>{renderTabs();scene3d.recolor();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{renderTabs();scene3d.recolor();});
refresh();
setTimeout(()=>toast('Выберите «Эскиз:1» в дереве и нажмите «Элемент выдавливания», или плоскость и «Создать эскиз»'),700);
})();
</script>
