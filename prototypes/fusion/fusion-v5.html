function renderProjects(){const list=sampleProjects;$('#projectGrid').innerHTML=list.map(([name,v,img],i)=>`<button class="project" data-proj="${i}" title="${name}"><span class="thumb"><img src="${img}" alt="Превью: ${name}" draggable="false"></span><span class="meta"><span class="orangeMini"></span><span class="pname">${name}</span><span class="vlabel">${v} ▾</span></span></button>`).join('')}
function setData(state){dataOpen=state;app.classList.toggle('show-data',state);$('#dataBtn').classList.toggle('selected',state);hideMenu();requestAnimationFrame(resizeGrid);sendEvent('panel.data',{open:state})}
function setActiveTab(tab){activeTab=tab;renderRibbon();hideMenu();sendEvent('workspace.tab',{tab})}
function hideMenu(){popup.classList.remove('show');popup.innerHTML='';popupSource=null}
function showMenu(anchor,title,items){const rect=anchor.getBoundingClientRect();popup.innerHTML=`<div class="popTitle">${title}</div>${items.map((item,i)=>item.sep?'<div class="popSep"></div>':`<button class="popitem" data-menu-item="${i}">${icon(item.icon||'cube',25)}<span>${item.name}</span><span class="shortcut">${item.shortcut||''}</span></button>`).join('')}`;popup.dataset.menuItems=JSON.stringify(items);popup.classList.add('show');const w=Math.max(245,popup.offsetWidth);popup.style.left=Math.min(Math.max(4,rect.left),innerWidth-w-5)+'px';popup.style.top=Math.min(rect.bottom+2,innerHeight-Math.min(popup.offsetHeight,400)-4)+'px';popupSource=anchor}
function groupMenu(el,name){const group=rCfg[activeTab].find(x=>x[0]===name);if(!group)return;showMenu(el,name,group[2].map((t,i)=>({name:t,icon:group[1][i]})))}
function selectedTool(tool,iconName='cube'){sendEvent('tool.select',{tool,workspace:activeTab});hideMenu();if(['Выдавливание','Создать эскиз','Вращение','Скругление','Отверстие','Измерить','Смещённая плоскость','Фаска','Оболочка','Прямоугольный массив','Переместить','Соединение'].includes(tool)){openParams(tool,iconName)}else if(tool==='Выбрать'){navMode='orbit';renderNav();toast('Режим выбора объектов')}else toast(`Выбран инструмент: ${tool} · CAD-движок пока не подключён`)}
function openParams(tool,ic){activeTool=tool;$('#paramTitle').textContent=tool;$('#paramIcon').innerHTML=icon(ic,28);let html='';if(tool==='Создать эскиз')html=`<div style="margin-bottom:13px;color:#6d7478">Выберите рабочую плоскость или грань.</div><div class="paramField"><label>Плоскость</label><select><option>XY (сверху)</option><option>XZ (спереди)</option><option>YZ (справа)</option></select></div>`;else if(tool==='Выдавливание')html=`<div class="paramField"><label>Профили</label><select><option>Выбрать...</option></select></div><div class="paramField"><label>Тип</label><select><option>По расстоянию</option><option>До объекта</option><option>Симметрично</option></select></div><div class="paramField"><label>Расстояние</label><input type="number" value="10" step="1">мм</div><div class="paramField"><label>Операция</label><select><option>Новое тело</option><option>Объединить</option><option>Вырезать</option></select></div>`;else if(tool==='Измерить')html=`<p>Выберите геометрию для измерения.</p><div class="paramField"><label>Объект 1</label><input value="Не выбран" readonly></div><div class="paramField"><label>Объект 2</label><input value="Не выбран" readonly></div>`;else html=`<div class="paramField"><label>Объект</label><select><option>Выбрать...</option></select></div><div class="paramField"><label>Значение</label><input type="number" step="1" value="10">мм</div>`;$('#paramBody').innerHTML=html;$('#params').classList.add('show')}
function closeParams(accept=false){const tool=activeTool;$('#params').classList.remove('show');activeTool='';if(accept)toast(`Параметры «${tool}» зафиксированы в UI. Геометрия не создаётся.`);sendEvent('tool.dialog',{tool,accepted:accept})}
function renderGrid(){const w=viewport.clientWidth,h=viewport.clientHeight,ratio=devicePixelRatio||1;if(!w||!h)return; if(c.width!==Math.round(w*ratio)||c.height!==Math.round(h*ratio)){c.width=Math.round(w*ratio);c.height=Math.round(h*ratio)}ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const cx=w/2+panX,cy=h/2+panY;ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();
 if(view==='Верх'||view==='Спереди'||view==='Справа'){const step=26*zoom;ctx.strokeStyle='#e4e4e4';ctx.lineWidth=.75;for(let x=((cx%step)+step)%step;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=((cy%step)+step)%step;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#f6aaaa';ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.stroke();ctx.strokeStyle='#a1a0ff';ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,h);ctx.stroke();}
 else{const slope=.575,space=18.5*zoom,extent=Math.ceil((h+w*slope)/space)+3;ctx.lineWidth=.78;ctx.strokeStyle='#e2e2e3';for(let i=-extent;i<=extent;i++){const k=i*space;ctx.beginPath();ctx.moveTo(0,cy+slope*(0-cx)+k);ctx.lineTo(w,cy+slope*(w-cx)+k);ctx.stroke();ctx.beginPath();ctx.moveTo(0,cy-slope*(0-cx)+k);ctx.lineTo(w,cy-slope*(w-cx)+k);ctx.stroke()}ctx.lineWidth=1.1;ctx.strokeStyle='#ff9a9d';ctx.beginPath();ctx.moveTo(0,cy+slope*(0-cx));ctx.lineTo(w,cy+slope*(w-cx));ctx.stroke();ctx.strokeStyle='#9999ff';ctx.beginPath();ctx.moveTo(0,cy-slope*(0-cx));ctx.lineTo(w,cy-slope*(w-cx));ctx.stroke()}
 ctx.lineWidth=1;ctx.strokeStyle='#b3bcc2';ctx.beginPath();ctx.arc(cx,cy,5*zoom,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffffffa8';ctx.fill();ctx.strokeStyle='#a8afb6';ctx.beginPath();ctx.moveTo(cx-4,cy);ctx.lineTo(cx+4,cy);ctx.moveTo(cx,cy-4);ctx.lineTo(cx,cy+4);ctx.stroke();ctx.restore();}
const resizeGrid=()=>renderGrid();new ResizeObserver(resizeGrid).observe(viewport);window.addEventListener('resize',resizeGrid);
function setView(v){view=v;panX=0;panY=0;zoom=1;renderGrid();$('#navNote').textContent=`Вид: ${v}`;$('#navNote').classList.add('show');clearTimeout(setView.t);setView.t=setTimeout(()=>$('#navNote').classList.remove('show'),1200);sendEvent('viewport.view',{view:v})}
viewport.addEventListener('wheel',e=>{e.preventDefault();const prev=zoom;zoom=Math.max(.33,Math.min(4,zoom*(e.deltaY<0?1.13:.885)));renderGrid();sendEvent('viewport.zoom',{zoom,previous:prev})},{passive:false});c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};c.setPointerCapture(e.pointerId);viewport.classList.add('panning')});c.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;renderGrid()});c.addEventListener('pointerup',e=>{if(drag)sendEvent('viewport.pan',{panX,panY});drag=null;viewport.classList.remove('panning')});c.addEventListener('pointercancel',()=>{drag=null;viewport.classList.remove('panning')});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){setActiveTab(tab.dataset.tab);return}const btn=e.target.closest('[data-tool]');if(btn){selectedTool(btn.dataset.tool,btn.dataset.icon);return}const g=e.target.closest('[data-menu]');if(g){groupMenu(g,g.dataset.menu);return}const row=e.target.closest('[data-toggle]');if(row){const t=tree.find(x=>x.id===row.dataset.toggle);if(t){t.open=!t.open;renderTree()}return}const eye=e.target.closest('[data-eye]');if(eye){const t=tree.find(x=>x.id===eye.dataset.eye);if(t){t.visibility=!t.visibility;renderTree();sendEvent('browser.visibility',{object:t.id,visible:t.visibility})}return}const p=e.target.closest('[data-proj]');if(p){const item=sampleProjects[+p.dataset.proj];toast(`Выбран проект «${item[0]}». Подключение файлового хранилища — следующий этап.`);sendEvent('project.select',{name:item[0]});return}const nav=e.target.closest('[data-nav]');if(nav){const n=nav.dataset.nav;navMode=n;renderNav();if(n==='home'||n==='fit'){setView('Изометрия')}else if(n==='grid'){view=view==='Верх'?'Изометрия':'Верх';renderGrid()}else if(n==='options'||n==='display'){showMenu(nav,n==='options'?'Виды':'Отображение',[{name:'Изометрия',icon:'cube'},{name:'Верх',icon:'plane'},{name:'Спереди',icon:'rect'},{name:'Справа',icon:'rect'}])}return}const item=e.target.closest('[data-menu-item]');if(item){const d=JSON.parse(popup.dataset.menuItems)[+item.dataset.menuItem];if(popupSource&&popupSource.id==='modeBtn'){if(d.name==='Проектирование'){$('#modeBtn').innerHTML='<span class="modeLabel">МОДЕЛЬ</span><span class="chev">▾</span>';setActiveTab('ТВЁРДОЕ ТЕЛО')}else{toast('Рабочая среда «'+d.name+'» — визуальная заготовка без CAD-движка')}hideMenu();return;}if(['Изометрия','Верх','Спереди','Справа'].includes(d.name))setView(d.name);else selectedTool(d.name,d.icon);hideMenu();return}const cube=e.target.closest('[data-view]');if(cube){setView(cube.dataset.view);return}if(!e.target.closest('#popup')&&!e.target.closest('#modeBtn'))hideMenu()});
$('#dataBtn').addEventListener('click',()=>setData(!dataOpen));$('#closeData').addEventListener('click',()=>setData(false));$('#homeBtn').addEventListener('click',()=>{setData(true);toast('Панель проектов открыта')});$('#collapseBrowser').addEventListener('click',()=>{browserOpen=!browserOpen;$('#browser').classList.toggle('collapsed',!browserOpen);$('#browserItems').style.display=browserOpen?'':'none'});$('#hideBrowser').addEventListener('click',()=>$('#collapseBrowser').click());$('#modeBtn').addEventListener('click',e=>showMenu(e.currentTarget,'Рабочая среда',[{name:'Проектирование',icon:'cube'},{name:'Чертёж',icon:'rect'},{name:'Производство',icon:'ruler'},{name:'Электроника',icon:'pattern'}]));

document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideMenu();closeParams();}if(e.key==='g'&&!e.ctrlKey&&!e.metaKey){setData(!dataOpen)} });
