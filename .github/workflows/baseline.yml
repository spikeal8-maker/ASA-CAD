name: ASA-CAD baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  toubkal-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/toubkal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Supported CAD regression suite
        run: npm test

      - name: ASA M0 protected Part regression
        working-directory: .
        run: node tests/m0/protected-part.mjs

      - name: ASA M0 license and notices regression
        working-directory: .
        run: node tests/m0/license-baseline.mjs
