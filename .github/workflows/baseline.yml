name: ASA-CAD baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vendor-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/toubkal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build vendor baseline
        run: npm run build

      - name: Lint vendor baseline
        run: npm run lint

      - name: Supported vendor CAD regression suite
        run: npm test

      - name: ASA M0 protected Part regression
        working-directory: .
        run: node tests/m0/protected-part.mjs

      - name: ASA M0 license and notices regression
        working-directory: .
        run: node tests/m0/license-baseline.mjs

  asa-m1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install vendor runtime/tooling dependencies
        run: npm --prefix vendor/toubkal ci

      - name: ASA M1 public typecheck
        run: npm run typecheck:asa

      - name: ASA M1 architecture boundary
        run: npm run test:m1:architecture

      - name: ASA M1 document contracts
        run: npm run test:m1:contracts

      - name: ASA M1 application behavior
        run: npm run test:m1:application

      - name: ASA M1 protected Part on OpenCascade runtime
        run: npm run test:m1:runtime
