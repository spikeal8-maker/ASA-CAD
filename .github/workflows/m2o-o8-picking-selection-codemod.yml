name: M2O O8 picking/selection codemod

on:
  push:
    branches: [m2o/o8-picking-selection]
    paths:
      - scripts/m2o/apply-o8-picking-selection.mjs
      - .github/workflows/m2o-o8-picking-selection-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o8-picking-selection
      - name: Apply exact O8 picking/selection extraction
        run: node scripts/m2o/apply-o8-picking-selection.mjs
      - name: Commit O8 picking/selection extraction
        run: |
          git config user.name "asa-cad-o8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No O8 picking/selection diff produced"
            exit 1
          fi
          git commit -m "refactor(m2o): extract viewport picking and selection"
          git push origin HEAD:m2o/o8-picking-selection
