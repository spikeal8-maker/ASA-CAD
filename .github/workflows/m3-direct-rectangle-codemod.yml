name: M3.5 direct Rectangle codemod

on:
  push:
    branches: [impl/m3-direct-rectangle]
    paths:
      - tools/m3-direct-rectangle-codemod.cjs
      - .github/workflows/m3-direct-rectangle-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/m3-direct-rectangle
          fetch-depth: 0

      - name: Apply exact-anchor wiring
        run: node tools/m3-direct-rectangle-codemod.cjs

      - name: Commit product/test wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tests .github/workflows/m3-browser.yml
          git commit -m "impl: wire direct Rectangle interaction"
          git push origin HEAD:impl/m3-direct-rectangle
