name: M2O O8 camera navigation codemod

on:
  push:
    branches: [m2o/o8-camera-navigation]
    paths:
      - scripts/m2o/apply-o8-camera-navigation.mjs
      - .github/workflows/m2o-o8-camera-navigation-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o8-camera-navigation
      - name: Apply exact O8 camera extraction
        run: node scripts/m2o/apply-o8-camera-navigation.mjs
      - name: Commit O8 camera extraction
        run: |
          git config user.name "asa-cad-o8-camera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No O8 camera diff produced"
            exit 1
          fi
          git commit -m "refactor(m2o): extract viewport camera navigation"
          git push origin HEAD:m2o/o8-camera-navigation
