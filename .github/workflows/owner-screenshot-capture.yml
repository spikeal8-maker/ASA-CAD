name: OWNER_SCREENSHOT_CAPTURE

on:
  pull_request:
    branches: [main]
    paths:
      - src/web/**
      - tests/visual/**
      - .github/workflows/owner-screenshot-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-screenshot-capture:
    name: CAD-VIS-005
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V5 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 1

      - name: Record exact checkout
        shell: bash
        run: echo "ASA_CAD_CHECKOUT_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: source/vendor/toubkal/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix source/vendor/toubkal ci

      - name: Install Chromium for Playwright
        working-directory: source
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Build exact V5 product image
        run: docker build -t asa-cad:cad-vis-005 source

      - name: Record local image identity
        shell: bash
        run: echo "ASA_CAD_IMAGE_ID=$(docker image inspect -f '{{.Id}}' asa-cad:cad-vis-005)" >> "$GITHUB_ENV"

      - name: Start isolated exact V5 image
        run: docker run -d --name asa-cad-vis-005 -p 8088:8080 asa-cad:cad-vis-005

      - name: Wait for ASA-CAD build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8088/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs asa-cad-vis-005 || true
          exit 1

      - name: Capture CAD-VIS-005 lesson sequence and video
        working-directory: source
        env:
          ASA_CAD_URL: http://127.0.0.1:8088
          ASA_CAD_VIS_ROOT: cad-vis-005
          ASA_CAD_BASE_MAIN: 337bf6c802997ad2561c593f555751bd55a67f56
          ASA_CAD_RESULT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ASA_CAD_CHECKOUT_SHA: ${{ env.ASA_CAD_CHECKOUT_SHA }}
          ASA_CAD_IMAGE_ID: ${{ env.ASA_CAD_IMAGE_ID }}
        run: node tests/visual/cad-vis-005.mjs

      - name: Upload CAD-VIS-005 artifact
        uses: actions/upload-artifact@v4
        with:
          name: asa-cad-vis-005
          path: source/cad-vis-005/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show container logs on failure
        if: failure()
        run: docker logs asa-cad-vis-005 || true
