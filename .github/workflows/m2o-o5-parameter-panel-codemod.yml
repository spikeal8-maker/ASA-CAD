name: M2O O5 ParameterPanel codemod

on:
  push:
    branches: [m2o/o5-parameter-panel]
    paths:
      - scripts/m2o/apply-o5-parameter-panel.mjs
      - .github/workflows/m2o-o5-parameter-panel-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o5-parameter-panel
      - name: Apply exact ParameterPanel extraction
        run: node scripts/m2o/apply-o5-parameter-panel.mjs
      - name: Commit extracted App
        run: |
          if git diff --quiet -- src/web/App.tsx; then
            echo "No App diff produced"
            exit 1
          fi
          git config user.name "asa-cad-o5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/web/App.tsx
          git commit -m "refactor(m2o): extract ParameterPanel from App"
          git push origin HEAD:m2o/o5-parameter-panel
