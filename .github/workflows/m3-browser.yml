name: ASA-CAD M3 browser

on:
  push:
    branches: [main, integration/ui-core-unification]
    paths:
      - vendor/toubkal/package.json
      - vendor/toubkal/package-lock.json
      - tests/visual/**
      - src/**
      - build/**
      - tests/m3/**
      - spec/ui/command-registry.v1.json
      - package.json
      - .github/workflows/m3-browser.yml
  pull_request:
    paths:
      - vendor/toubkal/package.json
      - vendor/toubkal/package-lock.json
      - tests/visual/**
      - src/**
      - build/**
      - tests/m3/**
      - spec/ui/command-registry.v1.json
      - package.json
      - .github/workflows/m3-browser.yml

permissions:
  contents: read

jobs:
  m3-browser:
    runs-on: ubuntu-24.04 # Pinned Playwright 1.60.0 does not support Ubuntu 26.04.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install pinned frontend toolchain
        run: npm --prefix vendor/toubkal ci

      - name: Verify M3 architecture/foundation
        run: npm run test:m3

      - name: Build ASA shell
        run: npm run build:asa

      - name: Install Chromium
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Start isolated static shell server
        shell: bash
        run: |
          set -euo pipefail
          node tests/m2/static-server.mjs >/tmp/asa-m3-http.log 2>&1 &
          echo $! >/tmp/asa-m3-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/asa-m3-http.log
          exit 1

      - name: Exercise M3 direct Line mouse/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/direct-line-browser.mjs

      - name: Exercise U2 Line numeric placement, keyboard, IME guard and persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
          ASA_U2_LINE_EVIDENCE_DIR: ${{ runner.temp }}/u2-line-numeric
        run: node tests/m3/direct-line-numeric-browser.mjs

      - name: Exercise M3 direct Circle mouse/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/direct-circle-browser.mjs

      - name: Exercise M3 direct Arc mouse/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/direct-arc-browser.mjs

      - name: Exercise U2 Arc numeric phases, signed sweep, keyboard and persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
          ASA_U2_ARC_EVIDENCE_DIR: ${{ runner.temp }}/u2-arc-numeric
        run: node tests/m3/direct-arc-numeric-browser.mjs

      - name: Exercise actual Arc hook delayed-result ownership
        env:
          ASA_U2_ARC_EVIDENCE_DIR: ${{ runner.temp }}/u2-arc-numeric
        run: node tests/m3/arc-numeric-ownership-browser.mjs

      - name: Exercise M3 direct Rectangle mouse/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/direct-rectangle-browser.mjs

      - name: Exercise M3 Sketch selection/delete desktop/touch
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-selection-delete-browser.mjs

      - name: Exercise M3.6B rigid entity drag desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-entity-drag-browser.mjs

      - name: Exercise M3.7A Horizontal/Vertical constraints desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-orientation-constraints-browser.mjs

      - name: Exercise M3 Horizontal/Vertical driving dimensions desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-directional-dimensions-browser.mjs

      - name: Exercise M3 Linear driving dimension desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-linear-dimension-browser.mjs

      - name: Exercise M3 Diameter driving dimension desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-diameter-dimension-browser.mjs

      - name: Exercise M3 Radius driving dimension Circle/Arc desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-radius-dimension-browser.mjs

      - name: Exercise M3 Angular driving dimension desktop/touch/search/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-angular-dimension-browser.mjs

      - name: Exercise M3.7B Fixed solved-geometry freeze desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-fixed-freeze-browser.mjs

      - name: Exercise M3.7C Coincident Line endpoints desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-coincident-browser.mjs

      - name: Exercise M3.7D Parallel Lines desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-parallel-browser.mjs

      - name: Exercise M3.7E Perpendicular Lines desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-perpendicular-browser.mjs

      - name: Exercise Tangent Line-Circle desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-tangent-browser.mjs

      - name: Exercise Concentric Circle-Circle desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-concentric-browser.mjs

      - name: Exercise Equal Lines desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-equal-browser.mjs

      - name: Exercise Symmetry Line endpoints about Line desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-symmetry-browser.mjs

      - name: Exercise Point-on-curve Line endpoint to Line desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-point-on-curve-browser.mjs

      - name: Exercise Construction Line toggle desktop/touch/persistence
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m3/sketch-construction-browser.mjs

      - name: Upload U2 Line numeric regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asa-cad-u2-line-numeric
          path: ${{ runner.temp }}/u2-line-numeric
          if-no-files-found: warn
          retention-days: 30

      - name: Upload U2 Arc numeric regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asa-cad-u2-arc-numeric
          path: ${{ runner.temp }}/u2-arc-numeric
          if-no-files-found: warn
          retention-days: 30

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/asa-m3-http.log || true
