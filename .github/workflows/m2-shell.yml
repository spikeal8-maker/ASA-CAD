name: ASA-CAD M2 shell

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/**
      - scripts/**
      - tools/**
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - docs/ARCHITECTURE.md
      - docs/SYSTEM_SPEC.md
      - docs/STATUS.md
      - docs/M2O_OPTIMIZATION_GATE.md
      - spec/ui/command-registry.v1.json
      - spec/ui/layout-registry.v2.json
      - spec/ui/viewport-matrix.v1.json
      - build/**
      - tests/process/**
      - tests/m2/**
      - tests/m2o/**
      - tests/m3/**
      - package.json
  pull_request:
    paths:
      - AGENTS.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/**
      - scripts/**
      - tools/**
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - docs/ARCHITECTURE.md
      - docs/SYSTEM_SPEC.md
      - docs/STATUS.md
      - docs/M2O_OPTIMIZATION_GATE.md
      - spec/ui/command-registry.v1.json
      - spec/ui/layout-registry.v2.json
      - spec/ui/viewport-matrix.v1.json
      - build/**
      - tests/process/**
      - tests/m2/**
      - tests/m2o/**
      - tests/m3/**
      - package.json

permissions:
  contents: read

jobs:
  shell-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Verify PR/repository hygiene
        env:
          ASA_PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: node tests/process/pr-hygiene.mjs

      - name: Install pinned frontend toolchain
        run: npm --prefix vendor/toubkal ci

      - name: Typecheck ASA M2 presentation boundary
        run: npm run typecheck:asa

      - name: Verify M2O optimization gates
        run: npm run test:m2o

      - name: Verify M3 Sketch foundation
        run: npm run test:m3

      - name: Verify neutral OpenCascade render bridge
        run: npm run test:m2:render

      - name: Verify central keyboard shortcut policy
        run: npm run test:m2:shortcuts

      - name: Verify UI Scale policy
        run: npm run test:m2:ui-scale

      - name: Verify deterministic fixture routes
        run: vendor/toubkal/node_modules/.bin/tsx tests/m2/dev-routes.ts

      - name: Build ASA-owned shell
        run: npm run build:asa

      - name: Verify shell/vendor/runtime boundary
        run: node tests/m2/shell-build.mjs
