name: ASA-CAD M2 shell

on:
  push:
    branches: [main]
    paths:
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - src/host/**
      - spec/ui/command-registry.v1.json
      - spec/ui/layout-registry.v2.json
      - spec/ui/viewport-matrix.v1.json
      - build/**
      - tests/m2/**
      - package.json
      - .github/workflows/m2-shell.yml
  pull_request:
    paths:
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - src/host/**
      - spec/ui/command-registry.v1.json
      - spec/ui/layout-registry.v2.json
      - spec/ui/viewport-matrix.v1.json
      - build/**
      - tests/m2/**
      - package.json
      - .github/workflows/m2-shell.yml

permissions:
  contents: read

jobs:
  shell-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install pinned frontend toolchain
        run: npm --prefix vendor/toubkal ci

      - name: Typecheck ASA M2 presentation boundary
        run: npm run typecheck:asa

      - name: Verify UI architecture boundaries
        run: npm run test:m2:architecture

      - name: Verify command/layout registry consistency
        run: npm run test:m2:registry

      - name: Verify shared UI action model
        run: npm run test:m2:actions

      - name: Verify neutral OpenCascade render bridge
        run: npm run test:m2:render

      - name: Verify central keyboard shortcut policy
        run: npm run test:m2:shortcuts

      - name: Verify UI Scale policy
        run: npm run test:m2:ui-scale

      - name: Verify deterministic fixture routes
        run: vendor/toubkal/node_modules/.bin/tsx tests/m2/dev-routes.ts

      - name: Build ASA-owned shell
        run: npm run build:asa

      - name: Verify shell/vendor/runtime boundary
        run: node tests/m2/shell-build.mjs
