name: M2O O5 Part Sketch controller codemod

on:
  push:
    branches: [m2o/o5-part-sketch-controller]
    paths:
      - scripts/m2o/apply-o5-part-sketch-controller.mjs
      - .github/workflows/m2o-o5-part-sketch-controller-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o5-part-sketch-controller
      - name: Apply exact Part Sketch controller wiring
        run: node scripts/m2o/apply-o5-part-sketch-controller.mjs
      - name: Commit migrated App
        run: |
          if git diff --quiet -- src/web/App.tsx; then
            echo "No App diff produced"
            exit 1
          fi
          git config user.name "asa-cad-o5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/web/App.tsx
          git commit -m "refactor(m2o): move Part Sketch lifecycle out of App"
          git push origin HEAD:m2o/o5-part-sketch-controller
