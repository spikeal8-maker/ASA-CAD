name: ASA-CAD M2 browser

on:
  push:
    branches: [main]
    paths:
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - build/**
      - tests/m2/**
      - spec/ui/command-registry.v1.json
      - spec/ui/viewport-matrix.v1.json
      - package.json
      - .github/workflows/m2-browser.yml
  pull_request:
    paths:
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - build/**
      - tests/m2/**
      - spec/ui/command-registry.v1.json
      - spec/ui/viewport-matrix.v1.json
      - package.json
      - .github/workflows/m2-browser.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install pinned frontend toolchain
        run: npm --prefix vendor/toubkal ci

      - name: Build ASA shell
        run: npm run build:asa

      - name: Verify static shell boundary
        run: node tests/m2/shell-build.mjs

      - name: Install Chromium
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Start isolated static shell server
        shell: bash
        run: |
          set -euo pipefail
          node tests/m2/static-server.mjs >/tmp/asa-m2-http.log 2>&1 &
          echo $! >/tmp/asa-m2-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/asa-m2-http.log
          exit 1

      - name: Exercise desktop and phone ASA shell
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/shell-browser.mjs

      - name: Exercise shared mobile action tools
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/mobile-tools-browser.mjs

      - name: Exercise full protected Part workflow
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/part-browser.mjs

      - name: Exercise viewport mouse navigation
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/navigation-browser.mjs

      - name: Exercise Fit and standard views
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/views-browser.mjs

      - name: Exercise central keyboard shortcuts
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/shortcuts-browser.mjs

      - name: Exercise ordinary body and tree selection sync
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/ordinary-selection-browser.mjs

      - name: Exercise real touch navigation and selection
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/touch-browser.mjs

      - name: Exercise deterministic Part fixtures
        env:
          ASA_CAD_FIXTURE_BASE_URL: http://127.0.0.1:8090
        run: node tests/m2/fixtures-browser.mjs

      - name: Exercise required effective viewport matrix
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/responsive-browser.mjs

      - name: Exercise visible persistent UI Scale settings
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/ui-scale-settings-browser.mjs

      - name: Exercise B-Rep picking across UI Scale changes
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/ui-scale-picking-browser.mjs

      - name: Exercise browser zoom effective viewport + DPR model
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8090/
        run: node tests/m2/browser-zoom-equivalence.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/asa-m2-http.log || true
