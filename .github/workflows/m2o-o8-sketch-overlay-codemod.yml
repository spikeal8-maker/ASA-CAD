name: M2O O8 Sketch overlay codemod

on:
  push:
    branches: [m2o/o8-sketch-overlay]
    paths:
      - scripts/m2o/apply-o8-sketch-overlay.mjs
      - .github/workflows/m2o-o8-sketch-overlay-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o8-sketch-overlay
      - name: Apply exact O8 Sketch overlay seam
        run: node scripts/m2o/apply-o8-sketch-overlay.mjs
      - name: Commit O8 Sketch overlay seam
        run: |
          git config user.name "asa-cad-o8-overlay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No O8 Sketch overlay diff produced"
            exit 1
          fi
          git commit -m "refactor(m2o): add separate Sketch overlay seam"
          git push origin HEAD:m2o/o8-sketch-overlay
