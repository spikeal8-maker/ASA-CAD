name: M3.2 Line codemod

on:
  push:
    branches: [m3/m3-2-line-tool]
    paths:
      - scripts/m3/apply-m3-2-line-wiring.mjs
      - .github/workflows/m3-2-line-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/m3-2-line-tool
      - name: Apply exact M3.2 Line wiring
        run: node scripts/m3/apply-m3-2-line-wiring.mjs
      - name: Remove one-shot codemod files
        run: |
          rm scripts/m3/apply-m3-2-line-wiring.mjs
          rm .github/workflows/m3-2-line-codemod.yml
      - name: Commit M3.2 Line wiring
        run: |
          git config user.name "asa-cad-m3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M3.2: wire direct Line tool"
          git push origin HEAD:m3/m3-2-line-tool
