name: M2O apply refactor

on:
  push:
    branches: [m2-optimization-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m2o-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-optimization-gate
          fetch-depth: 0

      - name: Apply deterministic App persistence refactor
        run: node scripts/m2o-refactor-app.mjs

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/App.tsx tests/m2/part-browser.mjs
          git commit -m "refactor(m2o): route editor persistence through CadProjectSession [m2o-applied]"
          git push origin HEAD:m2-optimization-gate
