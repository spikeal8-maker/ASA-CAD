name: M2O O4 ribbon codemod

on:
  push:
    branches: [m2o/o4-ribbon-actions]
    paths:
      - scripts/m2o/apply-o4-ribbon-actions.mjs
      - .github/workflows/m2o-o4-ribbon-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o4-ribbon-actions
      - name: Apply exact App ribbon migration
        run: node scripts/m2o/apply-o4-ribbon-actions.mjs
      - name: Commit migrated App
        run: |
          if git diff --quiet -- src/web/App.tsx; then
            echo "No App diff produced"
            exit 1
          fi
          git config user.name "asa-cad-o4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/web/App.tsx
          git commit -m "refactor(m2o): route ribbon commands through CadUiAction"
          git push origin HEAD:m2o/o4-ribbon-actions
