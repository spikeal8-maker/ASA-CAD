name: M2O promote persistence status

on:
  push:
    branches: [m2-optimization-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m2o-status-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-optimization-gate
          fetch-depth: 0
      - run: node scripts/m2o-promote-persistence-status.mjs
      - name: Commit status promotion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/ui/command-registry.v1.json
          git commit -m "spec(m2o): mark Save Open implemented [m2o-status-applied]"
          git push origin HEAD:m2-optimization-gate
