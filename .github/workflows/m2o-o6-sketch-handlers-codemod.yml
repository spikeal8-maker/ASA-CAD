name: M2O O6 Sketch handler codemod

on:
  push:
    branches: [m2o/o6-sketch-command-handlers]
    paths:
      - scripts/m2o/apply-o6-sketch-handlers.mjs
      - .github/workflows/m2o-o6-sketch-handlers-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/o6-sketch-command-handlers
      - name: Apply exact Sketch command-handler extraction
        run: node scripts/m2o/apply-o6-sketch-handlers.mjs
      - name: Commit extracted application switch
        run: |
          if git diff --quiet -- src/application/CadApplicationImpl.ts; then
            echo "No CadApplicationImpl diff produced"
            exit 1
          fi
          git config user.name "asa-cad-o6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/application/CadApplicationImpl.ts
          git commit -m "refactor(m2o): extract Sketch command handlers from application"
          git push origin HEAD:m2o/o6-sketch-command-handlers
