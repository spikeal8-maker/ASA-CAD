name: M2O wire settings

on:
  push:
    branches: [m2-optimization-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m2o-settings-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-optimization-gate
          fetch-depth: 0
      - run: node scripts/m2o-wire-settings.mjs
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No settings wiring changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/App.tsx
          git commit -m "refactor(m2o): use typed settings action [m2o-settings-applied]"
          git push origin HEAD:m2-optimization-gate
