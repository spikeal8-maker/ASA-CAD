name: M3.2 Line browser codemod

on:
  push:
    branches: [m3/m3-2-line-tool]
    paths:
      - scripts/m3/apply-m3-2-line-browser-tests.mjs
      - .github/workflows/m3-2-line-browser-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/m3-2-line-tool
      - name: Apply desktop and touch Line regressions
        run: node scripts/m3/apply-m3-2-line-browser-tests.mjs
      - name: Remove one-shot codemod files
        run: |
          rm scripts/m3/apply-m3-2-line-browser-tests.mjs
          rm .github/workflows/m3-2-line-browser-codemod.yml
      - name: Commit M3.2 browser regressions
        run: |
          git config user.name "asa-cad-m3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(m3): prove direct Line desktop and touch paths"
          git push origin HEAD:m3/m3-2-line-tool
