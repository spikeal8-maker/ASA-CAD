name: M3.1 browser codemod

on:
  push:
    branches: [m3/m3-1-solve-overlay]
    paths:
      - scripts/m3/apply-m3-1-browser-regression.mjs
      - .github/workflows/m3-1-browser-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/m3-1-solve-overlay
      - name: Apply exact M3.1 browser regression
        run: node scripts/m3/apply-m3-1-browser-regression.mjs
      - name: Remove one-shot codemod files
        run: |
          rm scripts/m3/apply-m3-1-browser-regression.mjs
          rm .github/workflows/m3-1-browser-codemod.yml
      - name: Commit browser regression
        run: |
          git config user.name "asa-cad-m3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(m3): prove Sketch solver overlay and lazy kernels"
          git push origin HEAD:m3/m3-1-solve-overlay
