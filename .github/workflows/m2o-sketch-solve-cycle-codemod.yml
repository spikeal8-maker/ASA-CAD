name: M2O Sketch solve-cycle codemod

on:
  push:
    branches: [m2o/sketch-solve-cycle]
    paths:
      - scripts/m2o/apply-sketch-solve-cycle.mjs
      - .github/workflows/m2o-sketch-solve-cycle-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/sketch-solve-cycle
      - name: Apply exact Sketch solve-cycle wiring
        run: node scripts/m2o/apply-sketch-solve-cycle.mjs
      - name: Commit Sketch solve-cycle wiring
        run: |
          git config user.name "asa-cad-sketch-solve-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Sketch solve-cycle diff produced"
            exit 1
          fi
          git commit -m "refactor(m2o): define Sketch solve cycle"
          git push origin HEAD:m2o/sketch-solve-cycle
