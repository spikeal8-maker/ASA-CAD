name: M2O SketchSession codemod

on:
  push:
    branches: [m2o/sketch-session-active-id]
    paths:
      - scripts/m2o/apply-sketch-session-wiring.mjs
      - .github/workflows/m2o-sketch-session-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2o/sketch-session-active-id
      - name: Apply exact SketchSession wiring
        run: node scripts/m2o/apply-sketch-session-wiring.mjs
      - name: Commit SketchSession wiring
        run: |
          git config user.name "asa-cad-sketch-session-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No SketchSession diff produced"
            exit 1
          fi
          git commit -m "refactor(m2o): make active Sketch explicit"
          git push origin HEAD:m2o/sketch-session-active-id
