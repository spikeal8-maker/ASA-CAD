name: ASA-CAD Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - docker/**
      - release/**
      - package.json
      - tsconfig.json
      - build/**
      - spec/ui/**
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - src/host/**
      - tests/m0d/**
      - tests/m2/part-browser.mjs
      - .github/workflows/docker.yml
      - vendor/toubkal/package.json
      - vendor/toubkal/package-lock.json
      - vendor/toubkal/src/**
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - docker/**
      - release/**
      - package.json
      - tsconfig.json
      - build/**
      - spec/ui/**
      - src/web/**
      - src/browser/**
      - src/runtime/**
      - src/application/**
      - src/contracts/**
      - src/host/**
      - tests/m0d/**
      - tests/m2/part-browser.mjs
      - .github/workflows/docker.yml
      - vendor/toubkal/package.json
      - vendor/toubkal/package-lock.json
      - vendor/toubkal/src/**

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/toubkal/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix vendor/toubkal ci

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Build standalone image
        run: docker build -t asa-cad:ci .

      - name: Start standalone image
        run: docker run -d --name asa-cad-ci -p 8088:8080 asa-cad:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8088/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs asa-cad-ci
          exit 1

      - name: Smoke root, production mount and release metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8088/ >/tmp/asa-cad-index.html
          grep -qi '<base href="/cad/">' /tmp/asa-cad-index.html

          curl --fail --silent http://127.0.0.1:8088/cad/projects/m0d-protected >/tmp/asa-cad-project.html
          grep -qi '<base href="/cad/">' /tmp/asa-cad-project.html

          curl --fail --silent http://127.0.0.1:8088/cad/asa-cad-release.json >/tmp/asa-cad-release.json
          node -e "const m=require('/tmp/asa-cad-release.json'); if(m.releaseVersion!=='0.2.0-m2'||m.productShell!=='asa-m2'||m.mountPath!=='/cad'||m.runtime?.compute!=='client-browser'||m.runtime?.loading!=='lazy-on-first-solid-operation'||m.host?.geometryComputeBackend!==false) process.exit(1)"

          for url in http://127.0.0.1:8088/ http://127.0.0.1:8088/cad/projects/m0d-protected; do
            headers="$(curl --silent --dump-header - --output /dev/null "$url")"
            printf '%s\n' "$headers"
            grep -qi '^Cross-Origin-Opener-Policy: same-origin' <<<"$headers"
            grep -qi '^Cross-Origin-Embedder-Policy: require-corp' <<<"$headers"
          done

      - name: Real Chromium lazy ASA shell boot at standalone root
        env:
          ASA_CAD_URL: http://127.0.0.1:8088/
        run: node tests/m0d/browser-smoke.mjs

      - name: Real Chromium lazy ASA shell boot at /cad project route
        env:
          ASA_CAD_URL: http://127.0.0.1:8088/cad/projects/m0d-protected
        run: node tests/m0d/browser-smoke.mjs

      - name: Protected Part workflow in released Docker /cad route
        env:
          ASA_CAD_SHELL_URL: http://127.0.0.1:8088/cad/projects/m0d-protected
        run: node tests/m2/part-browser.mjs

      - name: Show container logs on failure
        if: failure()
        run: docker logs asa-cad-ci || true
